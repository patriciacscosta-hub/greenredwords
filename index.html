<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>[hidden]{display:none!important}body{margin:0}img{max-width:100%}</style>
<title>Word Lights</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Jost:wght@500;700&display=swap">
<style>
/* Layout: flat pastel colour blocks. Home = big title panel on the left, stacked full-bleed game bands on the right
   (stacks on phones). Each game fills the screen with its band colour. Deliberately one light, pastel world. */
:root{
  color-scheme:light;
  --ink:#26304D; --ink-soft:#56607C; --white:#FFFFFF;
  --sky:#A9C0CE;          /* home title panel */
  --mint:#BFE1C4;  --mint-deep:#8ED9A8;  --go:#279A5D;
  --pink:#F6D2DC;  --coral:#F0575C;      --coral-soft:#FF8A8A;
  --blue:#C4E3F5;  --lilac:#B0B5DB;      --sun:#FFC83A;
  --font-display:"Jost","Futura","Century Gothic","Trebuchet MS",system-ui,sans-serif;
  --font-read:"Andika","Comic Sans MS","Trebuchet MS",system-ui,sans-serif;
  --r:28px;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--sky);color:var(--ink);font-family:var(--font-display);font-size:17px;line-height:1.45;
  -webkit-tap-highlight-color:transparent;overscroll-behavior:none}
body[data-scene="speedy"],body[data-scene="speedy"] .play{background:var(--mint)}
body[data-scene="match"],body[data-scene="match"] .play{background:var(--pink)}
body[data-scene="sort"],body[data-scene="sort"] .play{background:var(--blue)}
body[data-scene="done"],body[data-scene="done"] .play{background:var(--lilac)}
body[data-scene="lists"],body[data-scene="lists"] .play{background:var(--lilac)}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
:focus-visible{outline:4px solid var(--ink);outline-offset:3px}
h1,h2,h3{margin:0;line-height:1;text-wrap:balance;font-weight:700}
.up{text-transform:uppercase;letter-spacing:.06em}

/* ---------- Critters ---------- */
.critter{display:block;overflow:visible}
.critter .bob{animation:bob 2.6s ease-in-out infinite;transform-origin:50% 100%;transform-box:fill-box}
.critter .eyes{animation:blink 4.2s infinite;transform-origin:center;transform-box:fill-box}
.critter.stop .bob{animation-delay:-1.3s}
.critter.stop .eyes{animation-delay:-2s}
.critter.happy .bob{animation:hop .55s ease 2}
.critter.oops .bob{animation:wobble .5s ease}
@keyframes bob{50%{transform:translateY(-4px) scaleY(1.02)}}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
@keyframes hop{0%,100%{transform:translateY(0)}40%{transform:translateY(-22px) scaleY(1.05)}70%{transform:translateY(0) scaleY(.9)}}
@keyframes wobble{20%{transform:rotate(-8deg)}40%{transform:rotate(7deg)}60%{transform:rotate(-5deg)}80%{transform:rotate(3deg)}}

/* ---------- Home ---------- */
.home{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);min-height:100%}
.hero{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;text-align:center;
  padding-block:80px 60px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:24px}
.hero .duo{display:flex;align-items:flex-end;gap:6px}
.hero .duo .critter{width:clamp(96px,14vw,150px);height:auto}
.hero h1{color:var(--white);font-size:clamp(3rem,8.5vw,6rem);letter-spacing:.04em;text-transform:uppercase}
.hero p{margin:0;max-width:34ch;font-size:1.1rem;font-weight:500;color:var(--ink)}
.hero p b{font-weight:700}
.hero p .g{color:var(--go)} .hero p .r{color:var(--coral)}
.stagechip{background:var(--white);color:var(--ink);border-radius:999px;padding:7px 7px 7px 22px;display:inline-flex;align-items:center;gap:14px;
  font-weight:700;letter-spacing:.06em;text-transform:uppercase;font-size:1.05rem;min-height:54px;transition:transform .15s}
.stagechip:hover{transform:translateY(-2px)}
.stagechip .chg{background:var(--sky);color:var(--white);border-radius:999px;padding:7px 16px;font-size:.85rem}
.hero p.focusline{font-size:.98rem;color:var(--ink);background:rgba(255,255,255,.45);border-radius:18px;padding:8px 16px;max-width:40ch}

/* ---------- Setup (class + term) ---------- */
.setup{min-height:100%;display:flex;align-items:center;justify-content:center;padding-block:40px;
  padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px))}
.setup-in{display:flex;flex-direction:column;align-items:center;gap:26px;text-align:center;max-width:920px;width:100%}
.setup .duo{display:flex;gap:6px;align-items:flex-end}
.setup .duo .critter{width:clamp(80px,12vw,120px);height:auto}
.setup h1{color:var(--white);font-size:clamp(2rem,6vw,3.6rem);text-transform:uppercase;letter-spacing:.04em}
.choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:16px;width:100%}
.choice .critter{width:clamp(70px,10vw,96px);height:auto}
.choice{border-radius:var(--r);padding:28px 18px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;min-height:200px;position:relative;transition:transform .15s}
.choice:hover{transform:translateY(-4px)}
.choice:active{transform:scale(.97)}
.choice .big{font-size:3.6rem;line-height:1}
.choice b{font-size:clamp(1.4rem,3.5vw,1.9rem);letter-spacing:.06em;text-transform:uppercase}
.choice small{font-weight:500;color:var(--ink-soft);font-size:1rem}
.choice .now{position:absolute;top:12px;right:12px;background:var(--ink);color:var(--white);border-radius:999px;padding:3px 12px;font-size:.78rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.c-mint{background:var(--mint)} .c-pink{background:var(--pink)} .c-peach{background:#FFD9BF} .c-sun{background:#FFEBA8} .c-blue{background:var(--blue)}
.linkback{color:var(--white);font-weight:700;letter-spacing:.06em;text-transform:uppercase;text-decoration:underline;text-underline-offset:4px;min-height:44px}
.listbox h4{margin:14px 0 8px;font-size:.85rem;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-soft)}
.listbox h4:first-of-type{margin-top:0}

.bands{display:flex;flex-direction:column;border-left:14px solid rgba(38,48,77,.08)}
.band{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;min-height:170px;
  padding-block:20px;padding-left:20px;padding-right:max(20px,env(safe-area-inset-right,0px));text-align:center;transition:filter .2s}
.band:hover{filter:brightness(1.03)}
.band:hover .art{transform:translateY(-4px)}
.band.b-mint{background:var(--mint)} .band.b-pink{background:var(--pink)} .band.b-blue{background:var(--blue)} .band.b-lilac{background:var(--lilac)}
.band .art{display:flex;align-items:flex-end;justify-content:center;gap:12px;transition:transform .2s;min-height:84px}
.band .art .critter{width:78px;height:auto}
.band .label{font-weight:700;font-size:1.3rem;letter-spacing:.06em;text-transform:uppercase;color:var(--ink)}
.band .best{font-size:.92rem;font-weight:500;color:var(--ink-soft)}
.band .best b{color:var(--ink)}
.tile{background:var(--white);border-radius:20px;display:grid;place-items:center;font-size:2.3rem;width:66px;height:66px;line-height:1}
.mini{font-family:var(--font-read);font-weight:700;font-size:1.7rem;padding:6px 16px 4px;border-radius:16px;line-height:1.1}
.mini.red{background:var(--coral);color:var(--white)}
.mini.green{background:var(--white);color:var(--go)}
.plus{color:var(--white);font-size:3.4rem;font-weight:700;line-height:.8}
@media (max-width:820px){
  .home{grid-template-columns:1fr}
  .bands{border-left:0;border-top:12px solid rgba(38,48,77,.08)}
  .hero{padding-block:70px 40px}
}

/* ---------- Sound buttons ---------- */
.sw{display:inline-flex;gap:.06em;font-family:var(--font-read);font-weight:700;line-height:1}
.gph{display:inline-flex;flex-direction:column;align-items:center;gap:.13em;padding:0 .02em;transition:color .2s}
.gph .mk{height:.15em;min-height:5px;border-radius:99px;background:currentColor;transition:transform .2s}
.gph .mk.dot{width:.15em;min-width:5px}
.gph .mk.bar{width:86%}
.gph.lit{color:var(--sun)} .gph.lit .mk{transform:scale(1.5)}

/* ---------- Play ---------- */
.play{min-height:100%;display:flex;flex-direction:column;padding-block:18px 32px;
  padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px))}
.bar{display:flex;align-items:center;gap:14px;flex-wrap:wrap;max-width:1040px;width:100%;margin:0 auto 14px}
.pill{background:var(--white);color:var(--ink);border-radius:999px;padding:10px 20px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;font-size:.95rem;min-height:46px}
.bar h2{flex:1 1 160px;min-width:0;color:var(--ink);font-size:clamp(1.3rem,3.4vw,1.9rem);letter-spacing:.06em;text-transform:uppercase}
@media (max-width:640px){ .bar .pips{order:5;flex:1 1 100%;justify-content:center} }
.pips{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.pips i{width:13px;height:13px;border-radius:50%;background:rgba(255,255,255,.6);display:block;flex:none}
.pips i.done{background:var(--sun)} .pips i.miss{background:rgba(38,48,77,.25)} .pips i.now{box-shadow:0 0 0 3px var(--ink)}
.score{font-weight:700;font-size:1.4rem;display:flex;align-items:center;gap:6px;font-variant-numeric:tabular-nums}
.score .st{color:var(--sun);font-size:1.7rem;-webkit-text-stroke:1px rgba(38,48,77,.15)}
.stage{position:relative;max-width:1040px;width:100%;margin:0 auto;flex:1}

/* Speedy tap */
.prompt{display:flex;align-items:flex-end;justify-content:center;gap:clamp(10px,3vw,26px);flex-wrap:wrap;margin-top:8px}
.prompt .critter{width:clamp(92px,15vw,140px);height:auto}
.wordcard{background:var(--white);border-radius:var(--r);padding:16px clamp(24px,5vw,48px) 20px;position:relative}
.wordcard::before{content:"";position:absolute;left:-12px;bottom:34px;border:12px solid transparent;border-right-color:var(--white);border-left:0}
.bigword{font-size:clamp(3.4rem,12vw,6.2rem);color:var(--go)}
.tools{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:16px}
.tool{background:rgba(255,255,255,.55);color:var(--ink);border-radius:999px;padding:9px 20px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;font-size:.9rem;min-height:46px}
.tool:hover{background:var(--white)}
.timer{height:16px;border-radius:99px;background:rgba(255,255,255,.55);overflow:hidden;margin:20px auto;max-width:640px}
.timer i{display:block;height:100%;width:100%;background:var(--go);border-radius:99px;transform-origin:left}
.timer.low i{background:var(--coral)}
.pics{display:grid;gap:clamp(10px,2vw,18px);grid-template-columns:repeat(var(--n,3),minmax(0,1fr));max-width:760px;margin:0 auto}
@media (max-width:560px){ .pics.n4{grid-template-columns:repeat(2,minmax(0,1fr))} .pics:not(.n4) .pic{font-size:2.8rem;border-radius:20px} }
.pic{background:var(--white);border-radius:var(--r);aspect-ratio:1;max-width:100%;font-size:clamp(3.2rem,11vw,5.6rem);
  display:grid;place-items:center;line-height:1;transition:transform .12s,background .2s,opacity .2s}
.pic:hover{transform:translateY(-3px)}
.pic:active{transform:scale(.95)}
.pic.right{background:var(--mint-deep);transform:scale(1.04)}
.pic.wrong{opacity:.35}
.pic:disabled{cursor:default}
.flash{position:absolute;left:50%;top:0;transform:translateX(-50%);font-weight:700;font-size:1.7rem;letter-spacing:.08em;text-transform:uppercase;
  background:var(--sun);color:var(--ink);padding:4px 22px;border-radius:999px;pointer-events:none;z-index:40;animation:pop .95s ease forwards;white-space:nowrap}
@keyframes pop{0%{opacity:0;transform:translate(-50%,10px) scale(.8)}20%{opacity:1;transform:translate(-50%,0) scale(1.1)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-14px)}}

/* Drag & match */
.howto{display:flex;align-items:center;justify-content:center;gap:14px;margin:0 auto 18px;max-width:640px}
.howto .critter{width:76px;height:auto;flex:none}
.howto p{margin:0;font-weight:500;font-size:1.1rem;background:var(--white);border-radius:20px;padding:10px 18px}
.slots{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));margin-bottom:26px}
.slot{border:4px dashed rgba(38,48,77,.18);background:rgba(255,255,255,.55);border-radius:var(--r);min-height:112px;display:grid;place-items:center;
  font-family:var(--font-read);font-weight:700;font-size:clamp(2rem,6vw,2.9rem);color:rgba(38,48,77,.32);transition:background .15s,border-color .15s,transform .15s;padding:8px}
.slot.hover,.slot:hover{border-color:var(--coral);background:var(--white)}
.slot.filled{border:4px solid transparent;background:var(--coral);color:var(--white);transform:scale(1.02)}
.sentences{display:flex;flex-direction:column;gap:14px;margin-bottom:26px}
.sentence{font-family:var(--font-read);font-size:clamp(1.4rem,4.4vw,2.2rem);font-weight:700;display:flex;flex-wrap:wrap;align-items:center;gap:.25em .3em;
  background:var(--white);border-radius:var(--r);padding:14px 22px}
.sentence .slot{display:inline-grid;min-height:62px;min-width:150px;font-size:1em;border-width:3px;border-radius:16px;color:transparent;padding:2px 14px;background:var(--pink)}
.sentence .slot.filled{color:var(--white);background:var(--coral)}
.tray{display:flex;flex-wrap:wrap;gap:14px;justify-content:center;min-height:90px;padding:10px}
.card{touch-action:none;user-select:none;-webkit-user-select:none;background:var(--coral);color:var(--white);
  font-family:var(--font-read);font-weight:700;font-size:clamp(1.8rem,5.5vw,2.6rem);padding:8px 28px 6px;border-radius:22px;
  position:relative;z-index:1;min-height:66px;line-height:1.2;transition:box-shadow .15s}
.card:hover{box-shadow:0 6px 0 rgba(38,48,77,.12)}
.card.dragging{z-index:50;box-shadow:0 16px 28px rgba(38,48,77,.25);cursor:grabbing}
.card.return{transition:transform .25s ease}
.card.selected{box-shadow:0 0 0 5px var(--white),0 0 0 9px var(--sun)}
.card.neutral{background:var(--white);color:var(--ink);font-size:clamp(2.4rem,8vw,3.4rem);padding:12px 36px 10px}
.shake{animation:shake .4s}
@keyframes shake{20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}

/* Sort */
.sortarea{display:grid;grid-template-columns:1fr auto 1fr;gap:18px;align-items:center;margin-top:6px}
@media (max-width:680px){ .sortarea{grid-template-columns:1fr 1fr} .sortarea .center{grid-column:1 / -1;grid-row:1} }
.basket{border-radius:var(--r);min-height:250px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:16px;transition:transform .15s,filter .15s}
.basket.g{background:var(--mint)} .basket.r{background:var(--pink)}
.basket.hover{transform:scale(1.04);filter:brightness(1.04)}
.basket .critter{width:96px;height:auto}
.basket b{font-size:1.25rem;letter-spacing:.06em;text-transform:uppercase}
.basket.g b{color:var(--go)} .basket.r b{color:var(--coral)}
.basket small{color:var(--ink-soft);text-align:center;font-size:.95rem;font-weight:500}
.basket .got{display:flex;flex-wrap:wrap;gap:4px 10px;justify-content:center;font-family:var(--font-read);font-weight:700;font-size:1.05rem}
.center{display:flex;flex-direction:column;align-items:center;gap:14px;min-width:200px;min-height:130px;justify-content:center}
.feedback{min-height:3.4em;text-align:center;font-weight:500;font-size:1.15rem;margin:18px auto 0;max-width:640px}
.feedback:not(:empty){background:var(--white);border-radius:20px;padding:12px 18px}
.feedback .g{color:var(--go);font-weight:700} .feedback .r{color:var(--coral);font-weight:700}
.feedback .sw{font-size:1.5rem;color:var(--go);vertical-align:middle;margin-left:6px}

/* Done */
.endcard{text-align:center;display:flex;flex-direction:column;align-items:center;gap:16px;padding:20px 0}
.endcard .duo{display:flex;gap:8px;align-items:flex-end}
.endcard .duo .critter{width:clamp(100px,18vw,150px);height:auto}
.endcard h2{font-size:clamp(2.4rem,7vw,3.8rem);color:var(--white);text-transform:uppercase;letter-spacing:.04em}
.bigstars{font-size:clamp(3rem,10vw,4.6rem);color:var(--sun);letter-spacing:.08em;line-height:1}
.bigstars .off{color:rgba(255,255,255,.45)}
.endcard p{margin:0;font-size:1.2rem;font-weight:500;max-width:40ch}
.btnrow{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;margin-top:6px}
.btn{border-radius:999px;padding:14px 32px;font-weight:700;font-size:1.15rem;letter-spacing:.06em;text-transform:uppercase;background:var(--ink);color:var(--white);min-height:54px}
.btn.alt{background:var(--white);color:var(--ink)}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:80;overflow:hidden}
.confetti i{position:absolute;top:-20px;width:14px;height:14px;border-radius:4px;animation:fall linear forwards}
.confetti i:nth-child(3n){border-radius:50%}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}

/* Teacher lists */
.lists{max-width:1040px;margin:0 auto;display:grid;gap:18px;grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
.listbox{background:var(--white);border-radius:var(--r);padding:20px 22px}
.listbox h3{font-size:1.2rem;letter-spacing:.06em;text-transform:uppercase;margin-bottom:12px}
.listbox h3.g{color:var(--go)} .listbox h3.r{color:var(--coral)}
.wordwrap{display:flex;flex-wrap:wrap;gap:10px 16px}
.wordwrap .sw{font-size:1.3rem;color:var(--ink)}
.redchip{font-family:var(--font-read);font-weight:700;font-size:1.15rem;color:var(--white);background:var(--coral);padding:2px 12px;border-radius:12px}
.listnote{max-width:1040px;margin:0 auto 16px;font-weight:500;background:rgba(255,255,255,.55);border-radius:20px;padding:12px 18px}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
  .confetti{display:none}
}
</style>
</head>
<body>
<!-- SETUP: which class + which term -->
<main class="setup" id="setup" hidden>
  <div class="setup-in">
    <div class="duo" id="setupDuo"></div>
    <h1 id="setupQ">Which class are you in?</h1>
    <div class="choices" id="choices"></div>
    <button class="linkback" id="setupBack" hidden>← Back</button>
  </div>
</main>

<!-- HOME -->
<main class="home" id="home">
  <section class="hero">
    <div class="duo" id="heroDuo"></div>
    <h1>Word Lights</h1>
    <p><b class="g">Green words</b> go: sound them out. <b class="r">Red words</b> stop: you just know them.</p>
    <button class="stagechip" id="changeStage" aria-label="Change class and term"><span id="stageLabel">Reception · Autumn</span><span class="chg">Change</span></button>
    <p class="focusline" id="focusLine"></p>
  </section>
  <nav class="bands" aria-label="Games">
    <button class="band b-mint" id="goSpeedy">
      <span class="art" aria-hidden="true"><span data-critter="go"></span><span class="tile" id="demoPic"></span></span>
      <span class="label">Speedy Tap</span>
      <span class="best" data-best="speedy"></span>
    </button>
    <button class="band b-pink" id="goMatch">
      <span class="art" aria-hidden="true"><span data-critter="stop"></span><span class="mini red">said</span></span>
      <span class="label">Red Word Match</span>
      <span class="best" data-best="match"></span>
    </button>
    <button class="band b-blue" id="goSort">
      <span class="art" aria-hidden="true"><span data-critter="go"></span><span data-critter="stop"></span></span>
      <span class="label">Green or Red?</span>
      <span class="best" data-best="sort"></span>
    </button>
    <button class="band b-lilac" id="goLists">
      <span class="plus" aria-hidden="true">+</span>
      <span class="label">Word lists</span>
      <span class="best">For teachers</span>
    </button>
  </nav>
</main>

<!-- PLAY -->
<main class="play" id="play" hidden>
  <div class="bar">
    <button class="pill" id="backBtn" aria-label="Back to all games">← Games</button>
    <h2 id="gameTitle"></h2>
    <div class="pips" id="pips" aria-hidden="true"></div>
    <div class="score" id="scoreBox" aria-live="polite"><span class="st">★</span><span id="scoreNum">0</span></div>
  </div>
  <div class="stage" id="stage"></div>
</main>

<script>
/* ======================= WORD BANKS ======================= */
// [word, sounds (space separated), picture, stage tag]
// Tags follow the usual Read Write Inc. order:
//   s1  = Set 1 single sounds (CVC words)     sf = Set 1 special friends (sh th ch qu ng nk ck, double letters)
//   cc  = words with consonant blends (frog, drum)

// Green words this term can use, and the ones it is focusing on
function greenPool(){ const st = STAGES[stageKey()]; return WORDS.filter(w => st.green.includes(w[3])); }
function greenFocus(){ const st = STAGES[stageKey()]; return WORDS.filter(w => st.focus.includes(w[3])); }
// Red words: everything taught so far in this class, newest first
function redPool(){
  const out = [];
  for(const t of TERMS){ out.push(...RED_NEW[`${year}-${t}`]); if(t === term) break; }
  return [...new Set(out)];
}
const redFocus = () => RED_NEW[stageKey()];
// Pick n items, about 60% from this term's focus and the rest as review
function mix(focus, pool, n){
  const f = shuffle(focus.slice()), keys = new Set(f);
  const rest = shuffle(pool.filter(x => !keys.has(x)));
  const nf = rest.length ? Math.min(f.length, Math.ceil(n*.6)) : f.length;
  let out = f.slice(0, nf).concat(rest.slice(0, n-nf));
  if(out.length < n) out = out.concat(f.slice(nf, nf + n - out.length));
  return shuffle(out.slice(0, n));
}

/* ---- drag (mouse + touch) with tap-to-select fallback ---- */
let selected = null;
function selectCard(c){
  if(selected) selected.classList.remove('selected');
  selected = c;
  if(c) c.classList.add('selected');
}
function draggable(el, onDrop){
  el.addEventListener('pointerdown', e => {
    if(el.dataset.locked) return;
    if(e.pointerType==='mouse' && e.button!==0) return;
    const sx = e.clientX, sy = e.clientY;
    let dragging = false, over = null;
    const move = ev => {
      const dx = ev.clientX-sx, dy = ev.clientY-sy;
      if(!dragging && Math.hypot(dx,dy) > 7){
        dragging = true; selectCard(null);
        el.classList.remove('return'); el.classList.add('dragging'); el.style.pointerEvents = 'none';
      }
      if(dragging){
        ev.preventDefault();
        el.style.transform = `translate(${dx}px,${dy}px) scale(1.08) rotate(${Math.max(-6,Math.min(6,dx/30))}deg)`;
        const hit = document.elementFromPoint(ev.clientX, ev.clientY);
        const t = hit ? hit.closest('[data-drop]') : null;
        if(t !== over){ over && over.classList.remove('hover'); over = t; over && over.classList.add('hover'); }
      }
    };
    const up = () => {
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
      window.removeEventListener('pointercancel', up);
      if(!dragging) return;
      el.classList.remove('dragging'); el.style.pointerEvents = '';
      over && over.classList.remove('hover');
      const ok = over ? onDrop(el, over) : false;
      if(!ok){ el.classList.add('return'); el.style.transform = ''; }
      el.dataset.justDragged = '1'; setTimeout(()=>{ delete el.dataset.justDragged; }, 50);
    };
    window.addEventListener('pointermove', move, {passive:false});
    window.addEventListener('pointerup', up);
    window.addEventListener('pointercancel', up);
  });
  el.addEventListener('click', () => {
    if(el.dataset.justDragged || el.dataset.locked) return;
    selectCard(selected === el ? null : el);
  });
}
function dropTarget(el, onDrop){
  el.setAttribute('data-drop','');
  el.addEventListener('click', () => {
    if(!selected) return;
    const c = selected; selectCard(null);
    if(!onDrop(c, el)) shake(c);
  });
}
function shake(el){ el.classList.remove('shake'); void el.offsetWidth; el.classList.add('shake'); }
function flash(text){
  const f = document.createElement('div'); f.className = 'flash'; f.textContent = text;
  stage.appendChild(f); setTimeout(()=>f.remove(), 1000);
}

/* ======================= GAME 1: SPEEDY TAP (green words) ======================= */
function startSpeedy(){
  const ROUNDS = 10;
  const nOpts = year==='reception' ? 3 : 4;
  const limit = year==='reception' ? 14000 : 9000;
  const words = mix(greenFocus(), greenPool(), ROUNDS);
  const id = shell('Speedy Tap', 'speedy', words.length);
  let i = 0, speedy = 0;

  function round(){
    if(!live(id)) return;
    if(i >= words.length) return finish('speedy', words.length, speedy ? `${speedy} ${speedy===1?'was':'were'} speedy!` : '');
    pip(i);
    const [w, sounds, pic] = words[i];
    const others = shuffle(greenPool().filter(x => x[0]!==w && x[2]!==pic)).slice(0, nOpts-1);
    const opts = shuffle([words[i], ...others]);
    stage.innerHTML = `
      <div class="prompt">
        ${goCritter()}
        <div class="wordcard"><div class="bigword" aria-label="${esc(w)}">${soundButtons(sounds)}</div></div>
      </div>
      <div class="tools">
        <button class="tool" id="fred">Sound it out</button>
      </div>
      <div class="timer" id="timer"><i></i></div>
      <div class="pics${nOpts===4?' n4':''}" style="--n:${nOpts}">
        ${opts.map(o => `<button class="pic" data-w="${esc(o[0])}" aria-label="picture: ${esc(o[0])}">${o[2]}</button>`).join('')}
      </div>`;
    const bar = $('#timer i'), timerBox = $('#timer');
    const t0 = performance.now();
    let over = false, missed = false;

    $('#fred').onclick = () => {
      const gs = [...stage.querySelectorAll('.bigword .gph')];
      gs.forEach((g,k) => setTimeout(() => {
        if(!live(id)) return;
        gs.forEach(x=>x.classList.remove('lit')); g.classList.add('lit');
        if(k === gs.length-1) setTimeout(() => gs.forEach(x=>x.classList.remove('lit')), 600);
      }, k*520));
    };

    function tick(now){
      if(!live(id) || over) return;
      const left = 1 - (now - t0)/limit;
      bar.style.transform = `scaleX(${Math.max(0,left)})`;
      timerBox.classList.toggle('low', left < .3);
      if(left <= 0) return timeout();
      requestAnimationFrame(tick);
    }
    requestAnimationFrame(tick);

    function end(correct){
      over = true;
      stage.querySelectorAll('.pic').forEach(b => b.disabled = true);
      pip(i, correct ? 'done' : 'miss');
      i++;
      setTimeout(round, correct ? 1300 : 2000);
    }
    function timeout(){
      react('.prompt .critter','oops');
      stage.querySelector(`.pic[data-w="${CSS.escape(w)}"]`).classList.add('right');
      flash('Time!');
      end(false);
    }
    stage.querySelectorAll('.pic').forEach(b => b.onclick = () => {
      if(over || b.disabled) return;
      if(b.dataset.w === w){
        b.classList.add('right'); react('.prompt .critter','happy');
        if(!missed){
          addStar();
          if(performance.now() - t0 < (year==='reception' ? 5000 : 3500)){ speedy++; flash('Speedy!'); }
          else flash('Yes!');
        }
        end(!missed);
      } else {
        missed = true; b.classList.add('wrong'); b.disabled = true; shake(b); react('.prompt .critter','oops');
      }
    });
  }
  round();
}

/* ======================= GAME 2: RED WORD MATCH (drag) ======================= */
function buildSentenceRounds(n){
  const reds = new Set(redPool()), fresh = new Set(redFocus());
  // this term's new words first, then review
  const ok = SENTENCES.filter(x => reds.has(x.a));
  const pool = [...shuffle(ok.filter(x => fresh.has(x.a))), ...shuffle(ok.filter(x => !fresh.has(x.a)))], rounds = [], used = new Set();
  for(let r=0; r<n; r++){
    const pick = [];
    for(const s of pool){
      if(pick.length === 3) break;
      if(used.has(s)) continue;
      if(pick.every(p => p.a!==s.a && !p.alt.includes(s.a) && !s.alt.includes(p.a))){ pick.push(s); }
    }
    if(pick.length < 3) break;
    pick.forEach(p => used.add(p));
    const answers = pick.map(p=>p.a);
    const blocked = new Set([...answers, ...pick.flatMap(p=>p.alt)]);
    const spare = shuffle(redPool().filter(w => !blocked.has(w)))[0];
    rounds.push({sentences: pick, cards: shuffle([...answers, spare])});
  }
  return rounds;
}
function startMatch(){
  const ROUNDS = 4;
  let rounds;
  if(year === 'reception'){
    rounds = Array.from({length: ROUNDS}, () => {
      const set = mix(redFocus(), redPool(), 3);
      return {targets: shuffle(set.slice()), cards: shuffle(set.slice())};
    });
  } else {
    rounds = buildSentenceRounds(ROUNDS);
  }
  const total = rounds.length * 3;
  const id = shell('Red Word Match', 'match', total);
  let r = 0, done = 0;

  function round(){
    if(!live(id)) return;
    if(r >= rounds.length) return finish('match', total);
    const R = rounds[r];
    let placed = 0;
    pip(done);
    const cardsHtml = R.cards.map((w,k) => `<button class="card" id="c${r}_${k}" data-word="${esc(w)}">${esc(w)}</button>`).join('');
    const help = year === 'reception'
      ? 'Drag each red word onto the word that looks the same. Or tap a word, then tap where it goes.'
      : 'Drag the red word that finishes each sentence. One word is left over.';
    let body;
    if(year === 'reception'){
      body = `<div class="slots">${R.targets.map(w => `<div class="slot" role="button" tabindex="0" data-word="${esc(w)}" aria-label="space for ${esc(w)}">${esc(w)}</div>`).join('')}</div>`;
    } else {
      body = `<div class="sentences">${R.sentences.map(s => {
          const [a,b] = s.s.split('___');
          return `<div class="sentence">${a.trim() ? `<span>${esc(a.trim())}</span>` : ''}<span class="slot" role="button" tabindex="0" data-word="${esc(s.a)}" data-cap="${a.trim()?'':'1'}" aria-label="gap"></span>${b.trim() ? `<span>${esc(b.trim())}</span>` : ''}</div>`;
        }).join('')}</div>`;
    }
    stage.innerHTML = `<div class="howto">${stopCritter()}<p>${help}</p></div>${body}<div class="tray">${cardsHtml}</div>`;

    const onDrop = (card, slot) => {
      if(!live(id) || slot.classList.contains('filled') || !slot.classList.contains('slot')) return false;
      if(card.dataset.word === slot.dataset.word){
        card.dataset.locked = '1'; card.classList.remove('return','selected');
        slot.textContent = slot.dataset.cap ? card.dataset.word[0].toUpperCase() + card.dataset.word.slice(1) : card.dataset.word;
        slot.classList.add('filled'); slot.removeAttribute('data-drop');
        card.remove();
        react('.howto .critter','happy');
        if(!card.dataset.missed) addStar();
        pip(done, card.dataset.missed ? 'miss' : 'done');
        done++; placed++;
        if(placed === 3){ flash(R.missedAny ? 'Done!' : 'Brilliant!'); r++; setTimeout(round, 1700); }
        else pip(done);
        return true;
      }
      card.dataset.missed = '1'; R.missedAny = true;
      shake(slot); react('.howto .critter','oops');
      return false;
    };
    stage.querySelectorAll('.card').forEach(c => draggable(c, onDrop));
    stage.querySelectorAll('.slot').forEach(s => {
      dropTarget(s, onDrop);
      s.addEventListener('keydown', e => { if(e.key==='Enter' || e.key===' '){ e.preventDefault(); s.click(); } });
    });
  }
  round();
}

/* ======================= GAME 3: GREEN OR RED? (sort) ======================= */
function startSort(){
  const N = 12;
  const g = mix(greenFocus(), greenPool(), N/2).map(x => ({w:x[0], kind:'g', sounds:x[1]}));
  const rd = mix(redFocus(), redPool(), N/2).map(w => ({w, kind:'r'}));
  const items = shuffle([...g, ...rd]);
  const id = shell('Green or Red?', 'sort', items.length);
  let i = 0;

  stage.innerHTML = `
    <div class="sortarea">
      <div class="basket g" id="bg" role="button" tabindex="0" data-kind="g">${goCritter()}<b>Green word</b><small>I can sound it out</small><div class="got"></div></div>
      <div class="center"><div id="slotC"></div></div>
      <div class="basket r" id="br" role="button" tabindex="0" data-kind="r">${stopCritter()}<b>Red word</b><small>I just have to know it</small><div class="got"></div></div>
    </div>
    <div class="feedback" id="fb" aria-live="polite"></div>`;
  const fb = $('#fb');

  function choose(card, basket){
    if(!live(id) || !basket.dataset.kind || card.dataset.locked) return false;
    const it = items[i];
    if(basket.dataset.kind === it.kind){
      card.dataset.locked = '1';
      if(!card.dataset.missed) addStar();
      pip(i, card.dataset.missed ? 'miss' : 'done');
      react(`#${basket.id} .critter`,'happy');
      basket.querySelector('.got').insertAdjacentHTML('beforeend', `<span>${esc(it.w)}</span>`);
      fb.innerHTML = it.kind === 'g'
        ? `<span class="g">“${esc(it.w)}” is a green word.</span> Sound it out: ${soundButtons(it.sounds)}`
        : `<span class="r">“${esc(it.w)}” is a red word.</span> You can't sound it out, you just know it.`;
      card.remove();
      i++; setTimeout(next, 1600);
      return true;
    }
    card.dataset.missed = '1'; shake(basket); react(`#${basket.id} .critter`,'oops');
    fb.innerHTML = it.kind === 'g' ? 'Try again. Can you say each sound?' : 'Try again. Can you really sound this one out?';
    return false;
  }
  function next(){
    if(!live(id)) return;
    if(i >= items.length) return finish('sort', items.length);
    pip(i);
    fb.innerHTML = '';
    $('#slotC').innerHTML = `<button class="card neutral" data-word="${esc(items[i].w)}">${esc(items[i].w)}</button>`;
    draggable($('#slotC .card'), choose);
  }
  ['#bg','#br'].forEach(sel => {
    const b = $(sel);
    b.setAttribute('data-drop','');
    b.addEventListener('click', () => { const c = $('#slotC .card'); if(c && !choose(c, b)) shake(c); selectCard(null); });
    b.addEventListener('keydown', e => { if(e.key==='Enter' || e.key===' '){ e.preventDefault(); b.click(); } });
  });
  next();
}

/* ======================= WORD LISTS (teachers) ======================= */
function showLists(){
  gameId++;
  $('#gameTitle').textContent = stageName();
  $('#scoreBox').hidden = true; $('#pips').hidden = true;
  showView('play', 'lists');
  const gf = greenFocus(), gr = greenPool().filter(x => !gf.includes(x));
  const rf = redFocus(), rr = redPool().filter(w => !rf.includes(w));
  stage.innerHTML = `
    <p class="listnote"><b>This term:</b> ${STAGES[stageKey()].about} About 6 in 10 words in each game come from this term's focus; the rest are review. Dots under a letter show one sound; a line shows letters making one sound together (special friends). Use Change on the home screen to see another class or term.</p>
    <div class="lists">
      <div class="listbox"><h3 class="g">Green words</h3>
        <h4>Focus this term</h4><div class="wordwrap">${gf.map(x => soundButtons(x[1])).join('')}</div>
        ${gr.length ? `<h4>Review</h4><div class="wordwrap">${gr.map(x => soundButtons(x[1])).join('')}</div>` : ''}</div>
      <div class="listbox"><h3 class="r">Red words</h3>
        <h4>New this term</h4><div class="wordwrap">${rf.map(w => `<span class="redchip">${esc(w)}</span>`).join('')}</div>
        ${rr.length ? `<h4>Review</h4><div class="wordwrap">${rr.map(w => `<span class="redchip">${esc(w)}</span>`).join('')}</div>` : ''}</div>
    </div>`;
}

/* ======================= HOME ======================= */
const GAMES = { speedy: startSpeedy, match: startMatch, sort: startSort };
function goHome(){
  gameId++; selectCard(null);
  renderHome(); showView('home', '');
}
function renderHome(){
  $('#stageLabel').textContent = stageName();
  $('#focusLine').textContent = 'This term: ' + STAGES[stageKey()].about;
  const demo = greenFocus()[0];
  $('#demoPic').textContent = demo[2];
  document.querySelectorAll('[data-best]').forEach(el => {
    const b = store.get(`best:${el.dataset.best}:${stageKey()}`, null);
    el.innerHTML = b ? `Best <b>★ ${b.s} / ${b.t}</b>` : 'Not played yet';
  });
}
$('#heroDuo').innerHTML = goCritter() + stopCritter();
fillCritters();
/* ---- start: which class, which term ---- */
function askClass(){
  gameId++;
  showView('setup', '');
  $('#setupQ').textContent = 'Which class are you in?';
  $('#setupBack').hidden = !(year && term);
  $('#setupBack').onclick = goHome;
  $('#choices').innerHTML = `
    <button class="choice c-mint" data-y="reception">${goCritter()}<b>Reception</b><small>I am 4 or 5</small></button>
    <button class="choice c-pink" data-y="year1">${stopCritter()}<b>Year 1</b><small>I am 5 or 6</small></button>`;
  $('#choices').querySelectorAll('button').forEach(b => b.onclick = () => { year = b.dataset.y; store.set('year', year); askTerm(); });
  $('#choices button').focus();
}
function askTerm(){
  $('#setupQ').textContent = 'Which term is it?';
  $('#setupBack').hidden = false;
  $('#setupBack').onclick = askClass;
  const now = termNow();
  const T = [['autumn','🍂','Autumn','September to December','c-peach'],
             ['spring','🌷','Spring','January to March','c-mint'],
             ['summer','☀️','Summer','April to July','c-sun']];
  $('#choices').innerHTML = T.map(([k,icon,name,months,cls]) =>
    `<button class="choice ${cls}" data-t="${k}">${k===now ? '<span class="now">Now</span>' : ''}<span class="big" aria-hidden="true">${icon}</span><b>${name}</b><small>${months}</small></button>`).join('');
  $('#choices').querySelectorAll('button').forEach(b => b.onclick = () => {
    term = b.dataset.t; store.set('term', term); goHome(); react('#heroDuo .critter','happy');
  });
  ($('#choices [data-t="'+now+'"]') || $('#choices button')).focus();
}
$('#setupDuo').innerHTML = goCritter() + stopCritter();
$('#changeStage').onclick = askClass;
$('#goSpeedy').onclick = startSpeedy;
$('#goMatch').onclick = startMatch;
$('#goSort').onclick = startSort;
$('#goLists').onclick = showLists;
$('#backBtn').onclick = goHome;
if(year && term){ renderHome(); showView('home', ''); } else askClass();
</script>
