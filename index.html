<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Word Lights">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#A9C0CE">
<meta name="description" content="Green and red word phonics games for Reception and Year 1.">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<style>[hidden]{display:none!important}body{margin:0}img{max-width:100%}</style>
<title>Word Lights</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Jost:wght@500;700&display=swap">
<style>
/* Layout: flat pastel colour blocks. Start = "who's playing?", then a winding level map for the child's class + term.
   Each level fills the screen with its colour (mint = green words, pink = red words, blue = mixed). One light pastel world. */
:root{
  color-scheme:light;
  --ink:#26304D; --ink-soft:#56607C; --white:#FFFFFF;
  --sky:#A9C0CE;
  --mint:#BFE1C4;  --mint-deep:#8ED9A8;  --go:#279A5D;
  --pink:#F6D2DC;  --coral:#F0575C;      --coral-soft:#FF8A8A;
  --blue:#C4E3F5;  --lilac:#B0B5DB;      --sun:#FFC83A;   --sun-soft:#FFF1C7;
  --peach:#FFDDC2; --lemon:#FFEEB0;
  --font-display:"Jost","Futura","Century Gothic","Trebuchet MS",system-ui,sans-serif;
  --font-read:"Andika","Comic Sans MS","Trebuchet MS",system-ui,sans-serif;
  --r:28px;
}
*{box-sizing:border-box}
html,body{height:100%}
body{--scene:var(--sky);background:var(--scene);color:var(--ink);font-family:var(--font-display);font-size:17px;line-height:1.45;
  -webkit-tap-highlight-color:transparent;overscroll-behavior:none}
body[data-scene="green"]{--scene:var(--mint)}
body[data-scene="red"]{--scene:var(--pink)}
body[data-scene="mix"]{--scene:var(--blue)}
body[data-scene="done"],body[data-scene="board"]{--scene:var(--lilac)}
body[data-scene="sounds"]{--scene:var(--blue)}
body[data-scene="map-autumn"]{--scene:var(--peach)}
body[data-scene="map-spring"]{--scene:var(--mint)}
body[data-scene="map-summer"]{--scene:var(--lemon)}
.setup,.map,.play{background:var(--scene)}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
:focus-visible{outline:4px solid var(--ink);outline-offset:3px}
h1,h2,h3{margin:0;line-height:1;text-wrap:balance;font-weight:700}
.up{text-transform:uppercase;letter-spacing:.06em}

/* ---------- Critters ---------- */
.critter{display:block;overflow:visible}
.critter .bob{animation:bob 2.6s ease-in-out infinite;transform-origin:50% 100%;transform-box:fill-box}
.critter .eyes{animation:blink 4.2s infinite;transform-origin:center;transform-box:fill-box}
.critter.stop .bob{animation-delay:-1.3s}
.critter.stop .eyes{animation-delay:-2s}
.critter.happy .bob{animation:hop .55s ease 2}
.critter.oops .bob{animation:wobble .5s ease}
@keyframes bob{50%{transform:translateY(-4px) scaleY(1.02)}}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
@keyframes hop{0%,100%{transform:translateY(0)}40%{transform:translateY(-22px) scaleY(1.05)}70%{transform:translateY(0) scaleY(.9)}}
@keyframes wobble{20%{transform:rotate(-8deg)}40%{transform:rotate(7deg)}60%{transform:rotate(-5deg)}80%{transform:rotate(3deg)}}

/* ---------- Coins + small pills ---------- */
.coin{display:inline-block;width:1.15em;height:1.15em;border-radius:50%;flex:none;position:relative;vertical-align:-.2em;
  background:radial-gradient(circle at 35% 32%,#FFF0A8 0 18%,#FFCF33 40%,#E9A70E 100%);box-shadow:inset 0 0 0 .1em #F7BE20}
.coin::after{content:"";position:absolute;inset:26%;border-radius:50%;border:.08em solid rgba(150,95,0,.4)}
.flycoin{position:fixed;width:30px;height:30px;z-index:95;pointer-events:none;transition:transform .75s cubic-bezier(.45,-0.35,.55,1),opacity .75s}
.pill{background:var(--white);color:var(--ink);border-radius:999px;padding:10px 20px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;font-size:.95rem;min-height:48px;display:inline-flex;align-items:center;gap:8px}
.pillstat{background:var(--white);border-radius:999px;padding:8px 16px;display:inline-flex;align-items:center;gap:7px;font-weight:700;font-size:1.2rem;min-height:48px;font-variant-numeric:tabular-nums}
.pillstat .st{color:var(--sun);font-size:1.4rem;-webkit-text-stroke:.6px rgba(38,48,77,.2)}
.bump{animation:bump .35s}
@keyframes bump{50%{transform:scale(1.22)}}

/* ---------- Setup screens (players, avatar, class, term) ---------- */
.setup{min-height:100%;display:flex;align-items:center;justify-content:center;padding-block:40px;
  padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px))}
.setup-in{display:flex;flex-direction:column;align-items:center;gap:24px;text-align:center;max-width:960px;width:100%}
.setup .duo{display:flex;gap:6px;align-items:flex-end}
.setup .duo .critter{width:clamp(80px,12vw,116px);height:auto}
.setup h1{color:var(--white);font-size:clamp(2rem,6vw,3.6rem);text-transform:uppercase;letter-spacing:.04em}
.setup .brand{font-size:clamp(1rem,2.4vw,1.2rem);color:var(--white);letter-spacing:.14em;text-transform:uppercase;font-weight:700;opacity:.9}
.choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:16px;width:100%}
.choices.small{grid-template-columns:repeat(auto-fill,minmax(110px,1fr))}
.choice{border-radius:var(--r);padding:24px 16px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;min-height:190px;position:relative;transition:transform .15s;background:var(--white)}
.choices.small .choice{min-height:110px;padding:14px}
.choice:hover{transform:translateY(-4px)}
.choice:active{transform:scale(.97)}
.choice .big{font-size:3.6rem;line-height:1}
.choices.small .choice .big{font-size:3.2rem}
.choice .critter{width:clamp(70px,10vw,96px);height:auto}
.choice b{font-size:clamp(1.3rem,3.2vw,1.8rem);letter-spacing:.06em;text-transform:uppercase}
.choice small{font-weight:500;color:var(--ink-soft);font-size:1rem;display:inline-flex;align-items:center;gap:6px}
.choice .now{position:absolute;top:12px;right:12px;background:var(--ink);color:var(--white);border-radius:999px;padding:3px 12px;font-size:.78rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.choice.add{background:rgba(255,255,255,.45);color:var(--white)}
.choice.add .big{font-weight:700;font-family:var(--font-display)}
.c-mint{background:var(--mint)} .c-pink{background:var(--pink)} .c-peach{background:var(--peach)} .c-sun{background:var(--lemon)} .c-blue{background:var(--blue)}
.setup-actions{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.linkback{color:var(--white);font-weight:700;letter-spacing:.06em;text-transform:uppercase;text-decoration:underline;text-underline-offset:4px;min-height:44px}
.namebox{display:flex;flex-direction:column;align-items:center;gap:12px;background:var(--white);border-radius:var(--r);padding:22px;width:min(460px,100%)}
.namebox .big{font-size:4.5rem;line-height:1}
.namebox label{font-weight:500;color:var(--ink-soft)}
.namebox input{font:inherit;font-family:var(--font-read);font-weight:700;font-size:1.6rem;text-align:center;width:100%;border:3px solid var(--line,#D6DCE8);border-radius:18px;padding:10px 14px;color:var(--ink);background:var(--white)}
.namebox input:focus{outline:none;border-color:var(--ink)}
.btn{border-radius:999px;padding:14px 32px;font-weight:700;font-size:1.15rem;letter-spacing:.06em;text-transform:uppercase;background:var(--ink);color:var(--white);min-height:54px}
.btn.alt{background:var(--white);color:var(--ink)}
.btn.sun{background:var(--sun);color:var(--ink)}

/* ---------- Map ---------- */
.map{min-height:100%;padding-bottom:40px}
.mapbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--scene);display:flex;gap:10px;flex-wrap:wrap;align-items:center;
  padding-block:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--scene)}
.mapbar .grow{flex:1}
.aa{font-family:var(--font-read);font-weight:700;text-transform:none;letter-spacing:0;font-size:1.1rem}
@media (max-width:560px){
  .mapbar{gap:6px;padding-block:8px}
  .mapbar .lbl,.mapbar .grow{display:none}
  .mapbar .pill,.mapbar .pillstat{padding:6px 11px;font-size:1rem;min-height:44px}
  .who{padding:4px 12px 4px 4px;min-height:44px;font-size:1rem}
  .who .ava{width:36px;height:36px}
  .who span:last-child{max-width:7em}
}
.who{background:var(--white);border-radius:999px;padding:5px 18px 5px 5px;display:inline-flex;align-items:center;gap:10px;font-weight:700;font-size:1.1rem;min-height:50px;max-width:100%}
.who .ava{width:40px;height:40px;border-radius:50%;background:var(--sun-soft);display:grid;place-items:center;font-size:1.6rem;flex:none}
.who span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.maphead{display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center;padding:10px 16px 0}
.maphead h1{color:var(--white);font-size:clamp(2.2rem,7vw,3.6rem);letter-spacing:.04em;text-transform:uppercase;text-shadow:0 2px 0 rgba(38,48,77,.12)}
.stagechip{background:var(--white);color:var(--ink);border-radius:999px;padding:7px 7px 7px 22px;display:inline-flex;align-items:center;gap:14px;
  font-weight:700;letter-spacing:.06em;text-transform:uppercase;font-size:1rem;min-height:52px}
.stagechip .chg{background:var(--ink);color:var(--white);border-radius:999px;padding:7px 16px;font-size:.8rem}
.focusline{margin:0;font-size:.98rem;font-weight:500;background:rgba(255,255,255,.55);border-radius:18px;padding:8px 16px;max-width:44ch}
.mapbox{position:relative;width:calc(100% - 32px);max-width:460px;margin:18px auto 0}
.mapbox svg.road{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.node{position:absolute;width:86px;height:86px;margin:-43px 0 0 -43px;border-radius:50%;background:var(--white);border:7px solid var(--go);
  display:grid;place-items:center;font-weight:700;font-size:1.9rem;color:var(--ink);z-index:2;transition:transform .15s}
.node:hover{transform:scale(1.06)}
.node.k-r{border-color:var(--coral)}
.node.k-mix{border-color:var(--sun);width:106px;height:106px;margin:-53px 0 0 -53px;font-size:2.6rem}
.node.locked{background:rgba(255,255,255,.5);border-color:rgba(38,48,77,.1);color:rgba(38,48,77,.35)}
.node.current{animation:pulse 1.6s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(255,255,255,.95)}70%{box-shadow:0 0 0 20px rgba(255,255,255,0)}100%{box-shadow:0 0 0 0 rgba(255,255,255,0)}}
.node .mech{position:absolute;top:-12px;right:-12px;width:36px;height:36px;border-radius:50%;background:var(--ink);color:var(--white);display:grid;place-items:center}
.node.locked .mech{background:rgba(38,48,77,.3)}
.mech svg{width:20px;height:20px;display:block}
.node .lock svg{width:30px;height:30px;display:block}
.node .nstars{position:absolute;top:100%;left:50%;transform:translateX(-50%);margin-top:5px;font-size:1.15rem;color:var(--sun);white-space:nowrap;letter-spacing:.02em;-webkit-text-stroke:.6px rgba(38,48,77,.25);line-height:1}
.node .nstars .off{color:rgba(255,255,255,.85)}
.me{position:absolute;width:64px;height:64px;margin:-32px 0 0 -32px;border-radius:50%;background:var(--white);display:grid;place-items:center;font-size:2.3rem;z-index:3;
  animation:bob2 1.4s ease-in-out infinite;box-shadow:0 5px 0 rgba(38,48,77,.12);pointer-events:none}
@keyframes bob2{50%{transform:translateY(-7px)}}
.deco{position:absolute;font-size:1.9rem;transform:translate(-50%,-50%);pointer-events:none;line-height:1}
.maplabel{position:absolute;transform:translate(-50%,-50%);background:var(--ink);color:var(--white);border-radius:999px;padding:4px 14px;font-weight:700;font-size:.85rem;letter-spacing:.08em;text-transform:uppercase;white-space:nowrap}

/* ---------- Sound buttons (dot = one sound, dash = special friends, arc = split sound) ---------- */
.sw{display:inline-flex;gap:.06em;font-family:var(--font-read);font-weight:700;line-height:1;padding-bottom:.08em}
.gph{display:inline-flex;flex-direction:column;align-items:center;gap:.13em;padding:0 .02em;transition:color .2s}
.gph .mk{height:.15em;min-height:4px;border-radius:99px;background:currentColor;transition:transform .2s}
.gph .mk.dot{width:.15em;min-width:4px}
.gph .mk.bar{width:86%}
.gph .mk.none{visibility:hidden;width:.15em}
.split{display:inline-flex;gap:.06em;position:relative;padding-bottom:.32em}
.split::after{content:"";position:absolute;left:.12em;right:.12em;bottom:0;height:.34em;border:.1em solid currentColor;border-top:0;border-radius:0 0 .7em .7em}
.gph.lit{color:var(--sun)} .gph.lit .mk{transform:scale(1.5)}

/* ---------- Play shell ---------- */
.play{min-height:100%;display:flex;flex-direction:column;padding-block:14px 32px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.bar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;max-width:1040px;width:100%;margin:0 auto 12px}
.bar h2{flex:1 1 160px;min-width:0;color:var(--ink);font-size:clamp(1.2rem,3.2vw,1.8rem);letter-spacing:.06em;text-transform:uppercase}
@media (max-width:640px){ .bar .pips{order:5;flex:1 1 100%;justify-content:center} }
.pips{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.pips i{width:14px;height:14px;border-radius:50%;background:rgba(255,255,255,.65);display:block;flex:none}
.pips i.done{background:var(--sun)} .pips i.miss{background:rgba(38,48,77,.25)} .pips i.now{box-shadow:0 0 0 3px var(--ink)}
.stage{position:relative;max-width:1040px;width:100%;margin:0 auto;flex:1}
.flash{position:absolute;left:50%;top:0;transform:translateX(-50%);font-weight:700;font-size:1.7rem;letter-spacing:.08em;text-transform:uppercase;
  background:var(--sun);color:var(--ink);padding:4px 22px;border-radius:999px;pointer-events:none;z-index:40;animation:pop .95s ease forwards;white-space:nowrap}
@keyframes pop{0%{opacity:0;transform:translate(-50%,10px) scale(.8)}20%{opacity:1;transform:translate(-50%,0) scale(1.1)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-14px)}}
.shake{animation:shake .4s}
@keyframes shake{20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}

/* Prompt (critter + speech bubble) */
.prompt{display:flex;align-items:flex-end;justify-content:center;gap:clamp(10px,3vw,24px);flex-wrap:wrap;margin-top:6px}
.prompt .critter{width:clamp(84px,14vw,130px);height:auto}
.wordcard{background:var(--white);border-radius:var(--r);padding:14px clamp(22px,5vw,44px) 18px;position:relative;display:flex;align-items:center;gap:16px}
.wordcard::before{content:"";position:absolute;left:-12px;bottom:30px;border:12px solid transparent;border-right-color:var(--white);border-left:0}
.bigword{font-size:clamp(3.2rem,11vw,6rem);color:var(--go)}
.bigword.red{color:var(--coral);font-family:var(--font-read);font-weight:700;line-height:1.1}
.tpic{font-size:clamp(3.4rem,11vw,5.6rem);line-height:1}
.need{display:flex;gap:6px}
.need i{width:18px;height:18px;border-radius:50%;border:3px solid var(--ink);display:block;opacity:.35}
.need i.got{background:var(--sun);opacity:1;border-color:var(--sun)}
.tools{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:14px}
.tool{background:rgba(255,255,255,.6);color:var(--ink);border-radius:999px;padding:9px 20px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;font-size:.9rem;min-height:46px}
.tool:hover{background:var(--white)}

/* Tap */
.timer{height:16px;border-radius:99px;background:rgba(255,255,255,.55);overflow:hidden;margin:18px auto;max-width:640px}
.timer i{display:block;height:100%;width:100%;background:var(--go);border-radius:99px;transform-origin:left}
.timer.low i{background:var(--coral)}
.pics{display:grid;gap:clamp(10px,2vw,18px);grid-template-columns:repeat(var(--n,3),minmax(0,1fr));max-width:760px;margin:0 auto}
@media (max-width:560px){ .pics.n4{grid-template-columns:repeat(2,minmax(0,1fr))} .pics:not(.n4) .pic{font-size:2.8rem;border-radius:20px} }
.pic{background:var(--white);border-radius:var(--r);aspect-ratio:1;max-width:100%;font-size:clamp(3.2rem,11vw,5.6rem);
  display:grid;place-items:center;line-height:1;transition:transform .12s,background .2s,opacity .2s}
.pic:hover{transform:translateY(-3px)}
.pic:active{transform:scale(.95)}
.pic.right{background:var(--mint-deep);transform:scale(1.04)}
.pic.wrong{opacity:.35}
.pic:disabled{cursor:default}
.pic.word{aspect-ratio:auto;min-height:clamp(110px,22vw,170px);font-family:var(--font-read);font-weight:700;font-size:clamp(2.2rem,7vw,3.6rem);color:var(--coral)}
.pic.word.right{background:var(--coral);color:var(--white)}

/* Bubble pop */
.arena{position:relative;height:min(60vh,540px);min-height:330px;border-radius:var(--r);background:rgba(255,255,255,.3);overflow:hidden;margin-top:14px;touch-action:manipulation}
.bubble{position:absolute;left:0;top:0;border-radius:50%;display:grid;place-items:center;font-family:var(--font-read);font-weight:700;line-height:1;padding:0;
  background:radial-gradient(circle at 30% 26%,rgba(255,255,255,.98) 0 11%,rgba(255,255,255,.7) 12% 52%,rgba(255,255,255,.38) 75%);
  box-shadow:inset 0 0 0 3px rgba(255,255,255,.95),inset -8px -10px 16px rgba(120,170,220,.28);will-change:transform;touch-action:manipulation}
.bubble.g{color:var(--go)} .bubble.r{color:var(--coral)}
.bubble.coinb .coin{font-size:2.6em}
.bubble.popping{transition:transform .22s ease-out,opacity .22s;opacity:0;pointer-events:none}
.bubble.nope{animation:nope .45s}
@keyframes nope{0%,100%{filter:none}40%{filter:grayscale(1) brightness(.85)}}

/* Drag & match */
.dprompt{display:flex;justify-content:center;margin-bottom:10px}
.dprompt .critter{width:clamp(70px,11vw,100px);height:auto}
.dtargets{display:grid;gap:14px;grid-template-columns:repeat(3,minmax(0,1fr));max-width:760px;margin:0 auto 26px}
.dtarget{background:var(--white);border-radius:var(--r);min-height:clamp(120px,24vw,180px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;
  border:4px dashed rgba(38,48,77,.15);transition:transform .15s,border-color .15s,background .15s;padding:8px}
.dtarget .dp{font-size:clamp(3rem,10vw,5rem);line-height:1}
.dtarget .dl{font-family:var(--font-read);font-weight:700;font-size:clamp(1.3rem,4vw,1.9rem);color:var(--go);min-height:1.2em}
.dtarget.word{font-family:var(--font-read);font-weight:700;font-size:clamp(1.8rem,6vw,2.8rem);color:rgba(38,48,77,.3);background:rgba(255,255,255,.55)}
.dtarget.hover{border-color:var(--ink);transform:scale(1.04)}
.dtarget.filled{border-style:solid;border-color:var(--go);background:var(--white)}
.dtarget.word.filled{border-color:transparent;background:var(--coral);color:var(--white)}
.dtray{display:flex;flex-wrap:wrap;gap:14px;justify-content:center;min-height:86px}
.dcard{touch-action:none;user-select:none;-webkit-user-select:none;background:var(--white);color:var(--go);font-family:var(--font-read);font-weight:700;
  font-size:clamp(1.8rem,5.5vw,2.6rem);padding:8px 28px 6px;border-radius:22px;position:relative;z-index:1;min-height:68px;line-height:1.2;box-shadow:0 5px 0 rgba(38,48,77,.12)}
.dcard.r{background:var(--coral);color:var(--white)}
.dcard.dragging{z-index:50;box-shadow:0 16px 28px rgba(38,48,77,.25);cursor:grabbing}
.dcard.return{transition:transform .25s ease}
.dcard.selected{box-shadow:0 0 0 5px var(--white),0 0 0 9px var(--sun)}
.dcard.hint{animation:hint 1.2s ease-in-out 2}
@keyframes hint{50%{transform:translateY(-12px)}}

/* Pairs */
.pairs{display:grid;gap:clamp(8px,2vw,16px);grid-template-columns:repeat(var(--cols),minmax(0,1fr));max-width:720px;margin:10px auto 0}
.pcard{aspect-ratio:3/4;padding:0;max-width:100%}
.pin{position:relative;display:block;width:100%;height:100%}
.pcard.open .pin,.pcard.matched .pin{animation:flip .32s ease}
@keyframes flip{0%{transform:scaleX(1)}50%{transform:scaleX(0)}100%{transform:scaleX(1)}}
.pback,.pfront{position:absolute;inset:0;border-radius:22px;display:grid;place-items:center;transition:opacity 0s .16s}
.pfront{opacity:0}
.pcard.open .pfront,.pcard.matched .pfront{opacity:1}
.pcard.open .pback,.pcard.matched .pback{opacity:0}
.pback{background:var(--lilac);color:var(--white);font-weight:700;font-size:clamp(2.4rem,8vw,3.6rem);
  background-image:radial-gradient(circle at 20% 20%,rgba(255,255,255,.25) 0 10%,transparent 11%),radial-gradient(circle at 80% 78%,rgba(255,255,255,.25) 0 12%,transparent 13%)}
.pfront{background:var(--white);padding:6px}
.pcard.matched .pfront{background:var(--sun-soft);box-shadow:inset 0 0 0 4px var(--sun)}
.pw{font-family:var(--font-read);font-weight:700;font-size:clamp(1.3rem,4.6vw,2.3rem)}
.pw.g{color:var(--go)} .pw.r{color:var(--coral)}
.pp{font-size:clamp(2.6rem,9vw,4.4rem);line-height:1}

/* End card */
.endcard{text-align:center;display:flex;flex-direction:column;align-items:center;gap:14px;padding:16px 0}
.endcard .duo{display:flex;gap:8px;align-items:flex-end}
.endcard .duo .critter{width:clamp(96px,17vw,140px);height:auto}
.endcard h2{font-size:clamp(2.2rem,7vw,3.6rem);color:var(--white);text-transform:uppercase;letter-spacing:.04em}
.bigstars{font-size:clamp(3rem,10vw,4.6rem);color:var(--sun);letter-spacing:.08em;line-height:1}
.bigstars .off{color:rgba(255,255,255,.45)}
.earned{display:inline-flex;align-items:center;gap:10px;background:var(--white);border-radius:999px;padding:8px 22px;font-weight:700;font-size:1.5rem}
.endcard p{margin:0;font-size:1.15rem;font-weight:500;max-width:40ch}
.btnrow{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;margin-top:6px}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:80;overflow:hidden}
.confetti i{position:absolute;top:-20px;width:14px;height:14px;border-radius:4px;animation:fall linear forwards}
.confetti i:nth-child(3n){border-radius:50%}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}

/* Clock + settings */
.clock svg{width:22px;height:22px;display:block}
.clock.low{background:var(--coral);color:var(--white)}
.setcard{max-width:720px;margin:0 auto 14px;background:var(--white);border-radius:22px;padding:18px 20px}
.setcard h3{font-size:1.05rem;letter-spacing:.08em;text-transform:uppercase;margin-bottom:6px}
.setcard .hint{margin:0 0 12px;color:var(--ink-soft);font-weight:500}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border-radius:999px;padding:9px 18px;font-weight:700;background:#EEF1F6;min-height:46px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--white)}
.prow{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:2px solid #EEF1F6;flex-wrap:wrap}
.prow:first-of-type{border-top:0}
.prow .bava{font-size:2rem}
.prow .pinfo{flex:1;min-width:130px;font-weight:700;font-size:1.1rem}
.prow .pinfo small{display:block;color:var(--ink-soft);font-weight:500;font-size:.92rem}
.mini{border-radius:999px;padding:8px 16px;font-weight:700;background:#EEF1F6;min-height:42px}
.mini.danger{background:var(--pink);color:#B3262C}
.mini.yes{background:#B3262C;color:var(--white)}
.critter.sleepy .eyes{animation:none;transform:scaleY(.12)}
.critter.sleepy .bob{animation-duration:4.5s}
.gatesum{font-size:clamp(2.4rem,8vw,3.4rem);font-weight:700;letter-spacing:.04em}

/* Leaderboard */
.board{max-width:660px;margin:0 auto;display:flex;flex-direction:column;gap:10px}
.boardnote{text-align:center;font-weight:500;margin:0 0 6px}
.brow{display:grid;grid-template-columns:44px 50px minmax(0,1fr) auto auto;align-items:center;gap:12px;background:var(--white);border-radius:22px;padding:10px 18px}
.brow.mine{box-shadow:0 0 0 4px var(--sun)}
.rank{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:1.2rem;background:#EEF1F6}
.rank.r1{background:var(--sun)} .rank.r2{background:#D9DFEA} .rank.r3{background:#F3BE92}
.bava{font-size:2.3rem;line-height:1;text-align:center}
.bname{font-weight:700;font-size:1.2rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bstat{font-weight:700;display:inline-flex;align-items:center;gap:6px;font-size:1.15rem;font-variant-numeric:tabular-nums}
.bstat .st{color:var(--sun);font-size:1.35rem;-webkit-text-stroke:.6px rgba(38,48,77,.2)}
@media (max-width:480px){ .brow{grid-template-columns:36px 40px minmax(0,1fr) auto;padding:10px 12px;gap:8px} .brow .bst{display:none} .rank{width:34px;height:34px} }

/* Sounds & red words */
.soundsintro{max-width:760px;margin:0 auto 16px;background:rgba(255,255,255,.6);border-radius:22px;padding:12px 18px;font-weight:500;display:flex;flex-wrap:wrap;gap:6px 18px;justify-content:center;align-items:center}
.soundsintro .sw{font-size:1.5rem;color:var(--ink)}
.soundsintro span.key{display:inline-flex;align-items:center;gap:8px}
.tabs{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-bottom:16px}
.tab{background:rgba(255,255,255,.55);border-radius:999px;padding:10px 20px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;min-height:50px;display:inline-flex;align-items:center;gap:8px}
.tab[aria-selected="true"]{background:var(--ink);color:var(--white)}
.tab .nowtag{background:var(--sun);color:var(--ink);border-radius:999px;padding:1px 9px;font-size:.72rem;letter-spacing:.08em}
.setnote{text-align:center;font-weight:500;margin:0 auto 14px;max-width:60ch}
.soundgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:12px;max-width:1040px;margin:0 auto}
.stile{background:var(--white);border-radius:22px;padding:16px 8px 14px;display:flex;flex-direction:column;align-items:center;justify-content:space-between;gap:12px;min-height:150px}
.stile .gr{font-size:3.1rem;color:var(--ink)}
.stile .ex{font-size:1.2rem;color:var(--ink-soft)}
.subhead{max-width:1040px;margin:22px auto 10px;font-size:1rem;letter-spacing:.08em;text-transform:uppercase;font-weight:700;color:var(--ink)}
.redgroup{max-width:1040px;margin:0 auto 14px;background:var(--white);border-radius:22px;padding:16px 18px}
.redgroup h3{font-size:1rem;letter-spacing:.08em;text-transform:uppercase;margin-bottom:12px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.redgroup h3 .nowtag{background:var(--sun);border-radius:999px;padding:2px 10px;font-size:.75rem}
.redwrap{display:flex;flex-wrap:wrap;gap:10px}
.redchip{font-family:var(--font-read);font-weight:700;font-size:1.5rem;color:var(--coral);background:var(--pink);padding:4px 16px;border-radius:14px}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
  .confetti{display:none}
}
</style>
</head>

const shuffle = a => { for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]} return a; };
const pickOne = a => a[Math.floor(Math.random()*a.length)];
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const store = {
  get(k,d){ try{ const v = localStorage.getItem('wordlights:'+k); return v===null ? d : JSON.parse(v); }catch(e){ return d; } },
  set(k,v){ try{ localStorage.setItem('wordlights:'+k, JSON.stringify(v)); }catch(e){} }
};
// Sound buttons: a dot under a single sound, a dash under special friends, an arc joining a split sound (a-e)
function soundButtons(sounds){
  const t = sounds.split(' ');
  const g = (txt, mk) => `<span class="gph"><span>${esc(txt)}</span><span class="mk ${mk}"></span></span>`;
  let h = '';
  for(let i=0;i<t.length;i++){
    const m = t[i].match(/^([a-z])-e$/);
    if(m && t[i+1]){ h += `<span class="split">${g(m[1],'none')}${g(t[i+1], t[i+1].length>1?'bar':'dot')}${g('e','none')}</span>`; i++; }
    else h += g(t[i], t[i].length>1 ? 'bar' : 'dot');
  }
  return `<span class="sw">${h}</span>`;
}
function shake(el){ el.classList.remove('shake'); void el.offsetWidth; el.classList.add('shake'); }
function flash(text){
  const f = document.createElement('div'); f.className = 'flash'; f.textContent = text;
  stage.appendChild(f); setTimeout(()=>f.remove(), 1000);
}
function confetti(){
  const box = document.createElement('div'); box.className = 'confetti';
  const cs = ['#8ED9A8','#FF8A8A','#FFC83A','#C4E3F5','#FFFFFF','#B0B5DB'];
  for(let i=0;i<70;i++){
    const p = document.createElement('i');
    p.style.left = Math.random()*100 + '%';
    p.style.background = cs[i % cs.length];
    p.style.animationDuration = (1.8 + Math.random()*1.6) + 's';
    p.style.animationDelay = (Math.random()*.6) + 's';
    box.appendChild(p);
  }
  document.body.appendChild(box); setTimeout(()=>box.remove(), 4200);
}

/* ======================= PLAYERS ======================= */
let players = store.get('players', []);
if(!Array.isArray(players)) players = [];
let player = players.find(p => p.id === store.get('current', null)) || null;
let year = player && player.year, term = player && player.term;
function save(){ store.set('players', players); store.set('current', player ? player.id : null); }
function usePlayer(p){ player = p; year = p.year; term = p.term; save(); }
const stageKey = () => `${year}-${term}`;
const stageName = () => `${year==='reception' ? 'Reception' : 'Year 1'} · ${term[0].toUpperCase()+term.slice(1)}`;
function termNow(){ const m = new Date().getMonth(); return m >= 8 ? 'autumn' : m <= 2 ? 'spring' : 'summer'; }
function progress(){ player.progress = player.progress || {}; return (player.progress[stageKey()] = player.progress[stageKey()] || []); }
const starTotal = p => Object.values(p.progress || {}).reduce((a,arr) => a + arr.reduce((x,y) => x + (y||0), 0), 0);

/* ======================= SETTINGS + PLAY TIME ======================= */
// limit: daily minutes per child (0 = no limit). timer: Speedy Tap countdown (normal / relaxed / off).
let settings = Object.assign({limit: 0, timer: 'normal'}, store.get('settings', {}));
const saveSettings = () => store.set('settings', settings);
const today = () => new Date().toLocaleDateString('en-CA');
function timeRec(p){ if(!p.time || p.time.date !== today()) p.time = {date: today(), used: 0, extra: 0}; return p.time; }
function timeLeft(p = player){ if(!settings.limit || !p) return Infinity; const t = timeRec(p); return (settings.limit + t.extra)*60 - t.used; }
let clockOn = false;   // true on the map and inside a level
function renderClock(){
  const left = timeLeft();
  ['map','play'].forEach(v => {
    const box = $('#'+v+'ClockBox');
    box.hidden = !isFinite(left);
    if(!isFinite(left)) return;
    const l = Math.max(0, left);
    $('#'+v+'Clock').textContent = l >= 60 ? `${Math.ceil(l/60)} min` : `0:${String(l).padStart(2,'0')}`;
    box.classList.toggle('low', l <= 60);
    box.setAttribute('aria-label', `time left: ${$('#'+v+'Clock').textContent}`);
  });
}
setInterval(() => {
  if(!player || !clockOn || document.visibilityState !== 'visible') return;
  const t = timeRec(player); t.used++;
  if(t.used % 10 === 0) save();
  renderClock();
  const left = timeLeft();
  if(left === 60){ ['#mapClockBox','#playClockBox'].forEach(s => { const b = $(s); b.classList.remove('bump'); void b.offsetWidth; b.classList.add('bump'); }); }
  if(left <= 0 && view === 'map'){ save(); showTimesUp(); }
}, 1000);

/* ======================= WORD PICKING ======================= */
function greenPool(){ const st = STAGES[stageKey()]; return WORDS.filter(w => st.green.includes(w[3])); }
function greenFocus(){ const st = STAGES[stageKey()]; return WORDS.filter(w => st.focus.includes(w[3])); }
function redPool(){
  const out = [];
  for(const t of TERMS){ out.push(...RED_NEW[`${year}-${t}`]); if(t === term) break; }
  return [...new Set(out)];
}
const redFocus = () => RED_NEW[stageKey()];
// About 60% from this term's focus, the rest as review
function mix(focus, pool, n){
  const f = shuffle(focus.slice()), keys = new Set(f);
  const rest = shuffle(pool.filter(x => !keys.has(x)));
  const nf = rest.length ? Math.min(f.length, Math.ceil(n*.6)) : f.length;
  let out = f.slice(0, nf).concat(rest.slice(0, n-nf));
  if(out.length < n) out = out.concat(f.slice(nf, nf + n - out.length));
  return shuffle(out.slice(0, n));
}
const greenItems = n => mix(greenFocus(), greenPool(), n).map(x => ({kind:'g', w:x[0], sounds:x[1], pic:x[2]}));
function redItems(n){   // may repeat when the class has few red words, but never twice in a row
  const pool = redPool(); let out = [];
  while(out.length < n){
    const b = mix(redFocus(), pool, Math.min(n - out.length, pool.length));
    if(out.length && b[0] === out[out.length-1]) b.push(b.shift());
    out = out.concat(b);
  }
  return out.map(w => ({kind:'r', w}));
}
const redSet = n => mix(redFocus(), redPool(), n).map(w => ({kind:'r', w}));   // all different
function lookAlikes(w, pool, n){
  const lw = w.toLowerCase();
  const score = x => { const lx = x.toLowerCase(); let c = 0; for(const ch of new Set(lx)) if(lw.includes(ch)) c++;
    return c*2 - Math.abs(lx.length - lw.length) + (lx[0]===lw[0] ? 2 : 0) + Math.random(); };
  return pool.filter(x => x.toLowerCase() !== lw).sort((a,b) => score(b) - score(a)).slice(0, n);
}

/* ======================= VIEWS + COINS ======================= */
let gameId = 0, view = '';
const live = id => id === gameId;
function show(id, scene){
  gameId++; view = id; clockOn = false;
  ['setup','map','play'].forEach(v => $('#'+v).hidden = v !== id);
  document.body.dataset.scene = scene || '';
  window.scrollTo(0,0);
}
function refreshCoins(bump){
  ['#mapCoins','#playCoins'].forEach(s => {
    const el = $(s); el.textContent = player ? player.coins : 0;
    if(bump){ const box = el.parentElement; box.classList.remove('bump'); void box.offsetWidth; box.classList.add('bump'); }
  });
}
let run = null;
function earn(n, fromEl){
  player.coins += n; if(run) run.coins += n; save();
  const target = view === 'map' ? $('#mapCoins') : $('#playCoins');
  if(!fromEl || !target){ refreshCoins(true); return; }
  const fr = fromEl.getBoundingClientRect(), tr = target.parentElement.getBoundingClientRect();
  const fx = fr.left + fr.width/2 - 15, fy = fr.top + fr.height/2 - 15;
  for(let k=0;k<n;k++){
    const c = document.createElement('span'); c.className = 'coin flycoin';
    c.style.left = fx + 'px'; c.style.top = fy + 'px';
    document.body.appendChild(c);
    requestAnimationFrame(() => requestAnimationFrame(() => {
      c.style.transitionDelay = (k*.12) + 's';
      c.style.transform = `translate(${tr.left + 22 - fx}px, ${tr.top + tr.height/2 - 15 - fy}px) scale(.7)`;
      c.style.opacity = '.3';
    }));
    setTimeout(() => { c.remove(); refreshCoins(true); }, 800 + k*120);
  }
}

/* ======================= MAP ======================= */
function currentLevel(){ const pr = progress(); const i = LEVELS.findIndex((_,k) => !pr[k]); return i < 0 ? LEVELS.length : i; }
function showMap(){
  if(timeLeft() <= 0) return showTimesUp();
  show('map', 'map-' + term);
  clockOn = true; renderClock();
  $('#mapAva').textContent = player.avatar; $('#mapName').textContent = player.name;
  $('#mapStars').textContent = starTotal(player);
  refreshCoins();
  $('#stageLabel').textContent = stageName();
  $('#focusLine').textContent = 'This term: ' + STAGES[stageKey()].about;

  const pr = progress(), cur = currentLevel(), n = LEVELS.length;
  const W = 360, gap = 132, top = 70;
  const pts = LEVELS.map((_,i) => ({x: 180 + 105*Math.sin(i*1.05 + .3), y: top + i*gap}));
  const H = top + (n-1)*gap + 120;
  let d = `M ${pts[0].x} ${pts[0].y - 60} L ${pts[0].x} ${pts[0].y}`;
  for(let i=1;i<n;i++){ const a = pts[i-1], b = pts[i]; d += ` C ${a.x} ${a.y + gap/2}, ${b.x} ${b.y - gap/2}, ${b.x} ${b.y}`; }
  const deco = DECO[term];
  const pct = (x,y) => `left:${x/W*100}%;top:${y/H*100}%`;
  let html = `<svg class="road" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-hidden="true">
      <path d="${d}" stroke="#FFFFFF" stroke-opacity=".75" stroke-width="26" fill="none" stroke-linecap="round"/>
      <path d="${d}" stroke="#26304D" stroke-opacity=".18" stroke-width="3" fill="none" stroke-linecap="round" stroke-dasharray="2 14"/>
    </svg>`;
  pts.forEach((p,i) => {
    if(i < n-1){ const mx = 360 - (p.x + pts[i+1].x)/2; html += `<span class="deco" style="${pct(Math.min(330,Math.max(30,mx)), p.y + gap/2)}" aria-hidden="true">${deco[i % deco.length]}</span>`; }
    const L = LEVELS[i], stars = pr[i] || 0, locked = i > cur;
    const cls = ['node', 'k-' + L.k, locked ? 'locked' : '', i === cur ? 'current' : ''].join(' ');
    const label = `Level ${i+1}, ${MECH[L.m]}, ${L.k==='g'?'green words':L.k==='r'?'red words':'green and red words'}${locked ? ', locked' : stars ? `, ${stars} stars` : ''}`;
    html += `<button class="${cls}" style="${pct(p.x,p.y)}" data-i="${i}" aria-label="${label}">
        ${locked ? `<span class="lock">${LOCK}</span>` : L.boss ? '🏆' : i+1}
        <span class="mech">${mechIcon(L.m)}</span>
        ${stars ? `<span class="nstars">${'★'.repeat(stars)}<span class="off">${'★'.repeat(3-stars)}</span></span>` : ''}
      </button>`;
  });
  html += `<span class="maplabel" style="${pct(pts[0].x, pts[0].y - 66)}">Start</span>`;
  const meAt = Math.min(cur, n-1), mp = pts[meAt];
  html += `<span class="me" style="${pct(mp.x + (mp.x > 180 ? -78 : 78), mp.y - 18)}" aria-hidden="true">${player.avatar}</span>`;
  const box = $('#mapbox');
  box.style.aspectRatio = `${W} / ${H}`;
  box.innerHTML = html;
  box.querySelectorAll('.node').forEach(b => b.onclick = () => {
    const i = +b.dataset.i;
    if(i > cur){ shake(b); return; }
    startLevel(i);
  });
  const node = box.querySelector('.node.current') || box.querySelector(`.node[data-i="${n-1}"]`);
  if(node && cur > 1) requestAnimationFrame(() => node.scrollIntoView({block:'center'}));
}

/* ======================= LEVEL RUNNER ======================= */
let backTo = showMap;
function shell(title, scene, total, back){
  show('play', scene);
  backTo = back || showMap;
  $('#gameTitle').textContent = title;
  $('#coinBox').hidden = !player;
  $('#playClockBox').hidden = true;
  refreshCoins();
  $('#pips').hidden = !total;
  $('#pips').innerHTML = Array.from({length: total || 0}, () => '<i></i>').join('');
  $('#backBtn').textContent = backTo === showMap ? '← Map' : '← Back';
  return gameId;
}
function pip(i, state){
  const ps = $('#pips').children;
  [...ps].forEach(p => p.classList.remove('now'));
  if(ps[i]){ if(state) ps[i].classList.add(state); else ps[i].classList.add('now'); }
}
function startLevel(i){
  if(timeLeft() <= 0) return showTimesUp();
  const L = LEVELS[i];
  const scene = L.k === 'g' ? 'green' : L.k === 'r' ? 'red' : 'mix';
  run = {i, good:0, total:0, coins:0, stars:null};
  const title = `${L.boss ? 'Trophy level' : 'Level ' + (i+1)} · ${MECH[L.m]}`;
  const done = () => finishLevel();
  clockOn = true;
  if(L.m === 'tap'){
    const items = L.k === 'mix' ? shuffle([...greenItems(4), ...redItems(4)]) : L.k === 'g' ? greenItems(6) : redItems(6);
    run.total = items.length; playTap(shell(title, scene, items.length), items, done);
  } else if(L.m === 'bubbles'){
    run.total = 4; playBubbles(shell(title, scene, 4), L.k, 4, done);
  } else if(L.m === 'drag'){
    run.total = 6; playDrag(shell(title, scene, 6), L.k, done);
  } else {
    const n = year === 'reception' ? 3 : 4;
    run.total = n; playPairs(shell(title, scene, n), L.k, n, done);
  }
  clockOn = true; renderClock();
}
function finishLevel(){
  const r = run, L = LEVELS[r.i];
  const ratio = r.good / r.total;
  const stars = r.stars || (ratio >= .9 ? 3 : ratio >= .6 ? 2 : 1);
  const pr = progress(), first = !pr[r.i];
  if(!pr[r.i] || stars > pr[r.i]) pr[r.i] = stars;
  const treasure = L.boss && first ? 10 : 0;
  player.coins += stars + treasure; r.coins += stars + treasure; save();
  refreshCoins(true);
  document.body.dataset.scene = 'done';
  clockOn = false;
  const head = stars === 3 ? 'Superstar!' : stars === 2 ? 'Great reading!' : 'Well done!';
  const next = r.i + 1 < LEVELS.length;
  stage.innerHTML = `<div class="endcard">
      <div class="duo">${goCritter()}${stopCritter()}</div>
      <div class="bigstars" aria-label="${stars} out of 3 stars">${'★'.repeat(stars)}<span class="off">${'★'.repeat(3-stars)}</span></div>
      <h2>${treasure ? 'Treasure!' : head}</h2>
      <div class="earned"><span class="coin"></span>+${r.coins} coins</div>
      ${treasure ? `<p>You finished the ${term} map! The treasure chest gave you 10 extra coins.</p>` : ''}
      <div class="btnrow">
        ${next ? '<button class="btn sun" id="nextLvl">Next level →</button>' : ''}
        <button class="btn alt" id="again">Play again</button>
        <button class="btn" id="toMap">Map</button>
      </div>
    </div>`;
  $('#pips').hidden = true;
  if(next) $('#nextLvl').onclick = () => startLevel(r.i + 1);
  $('#again').onclick = () => startLevel(r.i);
  $('#toMap').onclick = showMap;
  if(timeLeft() <= 0){
    clockOn = false;
    stage.querySelector('.btnrow').innerHTML = '<button class="btn sun" id="tuBtn">Next →</button>';
    $('#tuBtn').onclick = showTimesUp;
  }
  ($('#nextLvl') || $('#tuBtn') || $('#toMap')).focus();
  if(stars >= 2 || treasure){ confetti(); setTimeout(() => react('.endcard .critter','happy'), 100); }
}

/* ======================= MECHANIC 1: SPEEDY TAP ======================= */
function playTap(id, items, done){
  const nOpts = year === 'reception' ? 3 : 4;
  const limit = (year === 'reception' ? 15000 : 10000) * (settings.timer === 'relaxed' ? 2 : 1);
  const noTimer = settings.timer === 'off';
  const fast = year === 'reception' ? 5000 : 3500;
  let i = 0;
  function round(){
    if(!live(id)) return;
    if(i >= items.length) return done();
    pip(i);
    const it = items[i];
    let prompt, tiles;
    if(it.kind === 'g'){
      document.body.dataset.scene = items.some(x => x.kind === 'r') ? 'mix' : 'green';
      const others = shuffle(greenPool().filter(x => x[0] !== it.w && x[2] !== it.pic)).slice(0, nOpts-1).map(x => ({w:x[0], pic:x[2]}));
      const opts = shuffle([it, ...others]);
      prompt = `${goCritter()}<div class="wordcard"><div class="bigword" aria-label="${esc(it.w)}">${soundButtons(it.sounds)}</div></div>`;
      tiles = opts.map(o => `<button class="pic" data-w="${esc(o.w)}" aria-label="picture: ${esc(o.w)}">${o.pic}</button>`).join('');
    } else {
      const opts = shuffle([it.w, ...lookAlikes(it.w, redPool(), nOpts-1)]);
      prompt = `${stopCritter()}<div class="wordcard"><div class="bigword red">${esc(it.w)}</div></div>`;
      tiles = opts.map(o => `<button class="pic word" data-w="${esc(o)}">${esc(o)}</button>`).join('');
    }
    stage.innerHTML = `<div class="prompt">${prompt}</div>
      ${it.kind === 'g' ? '<div class="tools"><button class="tool" id="fred">Sound it out</button></div>' : ''}
      <div class="timer" id="timer"${noTimer ? ' style="visibility:hidden"' : ''}><i></i></div>
      <div class="pics${nOpts===4?' n4':''}" style="--n:${nOpts}">${tiles}</div>`;
    const bar = $('#timer i'), timerBox = $('#timer');
    const t0 = performance.now();
    let over = false, missed = false;
    if(it.kind === 'g') $('#fred').onclick = () => {
      const gs = [...stage.querySelectorAll('.bigword .gph')];
      gs.forEach((g,k) => setTimeout(() => {
        if(!live(id)) return;
        gs.forEach(x => x.classList.remove('lit')); g.classList.add('lit');
        if(k === gs.length-1) setTimeout(() => gs.forEach(x => x.classList.remove('lit')), 600);
      }, k*520));
    };
    function tick(now){
      if(!live(id) || over || noTimer) return;
      const left = 1 - (now - t0)/limit;
      bar.style.transform = `scaleX(${Math.max(0,left)})`;
      timerBox.classList.toggle('low', left < .3);
      if(left <= 0) return timeout();
      requestAnimationFrame(tick);
    }
    requestAnimationFrame(tick);
    function end(correct){
      over = true;
      stage.querySelectorAll('.pic').forEach(b => b.disabled = true);
      pip(i, correct ? 'done' : 'miss');
      i++;
      setTimeout(round, correct ? 1300 : 2000);
    }
    function timeout(){
      react('.prompt .critter','oops');
      stage.querySelector(`.pic[data-w="${CSS.escape(it.w)}"]`).classList.add('right');
      flash('Time!');
      end(false);
    }
    stage.querySelectorAll('.pic').forEach(b => b.onclick = () => {
      if(over || b.disabled) return;
      if(b.dataset.w === it.w){
        b.classList.add('right'); react('.prompt .critter','happy');
        if(!missed){
          run.good++;
          const speedy = performance.now() - t0 < fast;
          earn(speedy ? 2 : 1, b);
          flash(speedy ? 'Speedy!' : 'Yes!');
        }
        end(!missed);
      } else {
        missed = true; b.classList.add('wrong'); b.disabled = true; shake(b); react('.prompt .critter','oops');
      }
    });
  }
  round();
}

/* ======================= MECHANIC 2: BUBBLE POP ======================= */
function playBubbles(id, kind, rounds, done){
  const need = year === 'reception' ? 2 : 3;
  const targets = kind === 'g' ? greenItems(rounds) : redItems(rounds);
  const baseSize = year === 'reception' ? 120 : 106;
  const riseMs = year === 'reception' ? 10000 : 8000;
  let r = 0, bubbles = [], last = performance.now(), spawnT = 0, roundOver = true, popped = 0, missed = false;
  stage.innerHTML = `<div class="prompt" id="bprompt"></div><div class="arena" id="arena" aria-label="bubbles"></div>`;
  const arena = $('#arena');
  function renderNeed(){ $('#need').innerHTML = Array.from({length: need}, (_,k) => `<i class="${k < popped ? 'got' : ''}"></i>`).join(''); }
  function setRound(){
    if(!live(id)) return;
    if(r >= rounds) return done();
    pip(r); popped = 0; missed = false; roundOver = false; spawnT = 0;
    const t = targets[r];
    $('#bprompt').innerHTML = kind === 'g'
      ? `${goCritter()}<div class="wordcard"><span class="tpic" aria-label="Pop the word for this picture: ${esc(t.w)}">${t.pic}</span><span class="need" id="need"></span></div>`
      : `${stopCritter()}<div class="wordcard"><div class="bigword red">${esc(t.w)}</div><span class="need" id="need"></span></div>`;
    renderNeed();
  }
  function spawn(){
    const W = arena.clientWidth, H = arena.clientHeight;
    const s = Math.min(baseSize, W/3.2);
    const t = targets[r];
    const hasTarget = bubbles.some(b => b.target && !b.gone);
    const roll = Math.random();
    let word = null, isT = false, coin = false;
    if(!hasTarget || roll < .42){ word = t.w; isT = true; }
    else if(roll < .52) coin = true;
    else {
      const pool = kind === 'g' ? greenPool().filter(x => x[0] !== t.w).map(x => x[0]) : lookAlikes(t.w, redPool(), 4);
      if(pool.length) word = pickOne(pool); else coin = true;
    }
    const el = document.createElement('button');
    el.className = 'bubble ' + (coin ? 'coinb' : kind);
    el.style.width = el.style.height = s + 'px';
    el.style.fontSize = (s * (word && word.length > 4 ? .22 : .29)) + 'px';
    el.innerHTML = coin ? '<span class="coin"></span>' : esc(word);
    el.setAttribute('aria-label', coin ? 'coin' : word);
    arena.appendChild(el);
    // pick the start spot furthest from the bubbles still near the bottom, so they don't overlap
    const low = bubbles.filter(o => !o.gone && o.y > H - s*1.6);
    let x = 0, best = -1;
    for(let k=0;k<8;k++){
      const cx = Math.random() * Math.max(1, W - s);
      const dmin = low.length ? Math.min(...low.map(o => Math.abs(o.x - cx))) : W;
      if(dmin > best){ best = dmin; x = cx; }
    }
    const b = {el, x, y: H + 4, s, v: (H + s) / riseMs, ph: Math.random()*6, target: isT, coin, gone: false};
    bubbles.push(b);
    el.addEventListener('pointerdown', e => { e.preventDefault(); hit(b); });
    el.addEventListener('keydown', e => { if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); hit(b); } });
  }
  function pop(b){
    if(b.gone) return; b.gone = true;
    b.el.classList.add('popping');
    b.el.style.transform = `translate(${b.cx ?? b.x}px,${b.y}px) scale(1.45)`;
    setTimeout(() => b.el.remove(), 240);
  }
  function hit(b){
    if(b.gone || roundOver || !live(id)) return;
    if(b.coin){ pop(b); earn(1, b.el); return; }
    if(b.target){
      pop(b); popped++; renderNeed(); react('#bprompt .critter','happy');
      if(!missed) earn(1, b.el);
      if(popped >= need){
        roundOver = true;
        if(!missed) run.good++;
        pip(r, missed ? 'miss' : 'done');
        flash(missed ? 'Done!' : 'Yes!');
        setTimeout(() => { bubbles.forEach(pop); bubbles = []; r++; setRound(); }, 900);
      }
    } else {
      missed = true; b.el.classList.remove('nope'); void b.el.offsetWidth; b.el.classList.add('nope');
      react('#bprompt .critter','oops');
    }
  }
  function loop(now){
    if(!live(id)) return;
    const dt = Math.min(50, now - last); last = now;
    spawnT -= dt;
    if(!roundOver && spawnT <= 0 && bubbles.filter(b => !b.gone).length < 7){
      spawn(); spawnT = year === 'reception' ? 1200 : 950;
    }
    for(const b of bubbles){
      if(b.gone) continue;
      b.y -= b.v * dt;
      b.cx = b.x + Math.sin(now/700 + b.ph) * 10;
      b.el.style.transform = `translate(${b.cx}px,${b.y}px)`;
      if(b.y < -b.s){ b.gone = true; b.el.remove(); }
    }
    bubbles = bubbles.filter(b => !b.gone);
    requestAnimationFrame(loop);
  }
  setRound();
  requestAnimationFrame(loop);
}

/* ======================= MECHANIC 3: DRAG & MATCH ======================= */
let selected = null;
function selectCard(c){
  if(selected) selected.classList.remove('selected');
  selected = c;
  if(c) c.classList.add('selected');
}
function draggable(el, onDrop){
  el.addEventListener('pointerdown', e => {
    if(el.dataset.locked) return;
    if(e.pointerType === 'mouse' && e.button !== 0) return;
    const sx = e.clientX, sy = e.clientY;
    let dragging = false, over = null;
    const move = ev => {
      const dx = ev.clientX - sx, dy = ev.clientY - sy;
      if(!dragging && Math.hypot(dx,dy) > 7){
        dragging = true; selectCard(null); el.classList.remove('hint');
        el.classList.remove('return'); el.classList.add('dragging'); el.style.pointerEvents = 'none';
      }
      if(dragging){
        ev.preventDefault();
        el.style.transform = `translate(${dx}px,${dy}px) scale(1.08) rotate(${Math.max(-6,Math.min(6,dx/30))}deg)`;
        const hitEl = document.elementFromPoint(ev.clientX, ev.clientY);
        const t = hitEl ? hitEl.closest('[data-drop]') : null;
        if(t !== over){ over && over.classList.remove('hover'); over = t; over && over.classList.add('hover'); }
      }
    };
    const up = () => {
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
      window.removeEventListener('pointercancel', up);
      if(!dragging) return;
      el.classList.remove('dragging'); el.style.pointerEvents = '';
      over && over.classList.remove('hover');
      const ok = over ? onDrop(el, over) : false;
      if(!ok){ el.classList.add('return'); el.style.transform = ''; }
      el.dataset.justDragged = '1'; setTimeout(() => { delete el.dataset.justDragged; }, 50);
    };
    window.addEventListener('pointermove', move, {passive:false});
    window.addEventListener('pointerup', up);
    window.addEventListener('pointercancel', up);
  });
  el.addEventListener('click', () => {
    if(el.dataset.justDragged || el.dataset.locked) return;
    el.classList.remove('hint');
    selectCard(selected === el ? null : el);
  });
}
function dropTarget(el, onDrop){
  el.setAttribute('data-drop','');
  el.addEventListener('click', () => {
    if(!selected) return;
    const c = selected; selectCard(null);
    if(!onDrop(c, el)) shake(c);
  });
  el.addEventListener('keydown', e => { if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); el.click(); } });
}
function playDrag(id, kind, done){
  const per = 3, rounds = 2;
  let r = 0, placed = 0;
  function round(){
    if(!live(id)) return;
    if(r >= rounds) return done();
    const items = kind === 'g' ? greenItems(per) : redSet(per);
    let inRound = 0;
    pip(placed);
    const targets = shuffle(items.slice()), cards = shuffle(items.slice());
    stage.innerHTML = `
      <div class="dprompt">${kind === 'g' ? goCritter() : stopCritter()}</div>
      <div class="dtargets">${targets.map(t => kind === 'g'
        ? `<div class="dtarget" role="button" tabindex="0" data-w="${esc(t.w)}" aria-label="picture: ${esc(t.w)}"><span class="dp">${t.pic}</span><span class="dl"></span></div>`
        : `<div class="dtarget word" role="button" tabindex="0" data-w="${esc(t.w)}" aria-label="space for ${esc(t.w)}">${esc(t.w)}</div>`).join('')}</div>
      <div class="dtray">${cards.map((c,k) => `<button class="dcard ${kind}${r===0 && k===0 ? ' hint' : ''}" data-w="${esc(c.w)}">${esc(c.w)}</button>`).join('')}</div>`;
    const onDrop = (card, target) => {
      if(!live(id) || target.classList.contains('filled')) return false;
      if(card.dataset.w === target.dataset.w){
        card.dataset.locked = '1'; card.classList.remove('selected');
        target.classList.add('filled'); target.removeAttribute('data-drop');
        if(kind === 'g') target.querySelector('.dl').textContent = card.dataset.w;
        card.remove();
        react('.dprompt .critter','happy');
        if(!card.dataset.missed){ run.good++; earn(1, target); }
        pip(placed, card.dataset.missed ? 'miss' : 'done');
        placed++; inRound++;
        if(inRound === per){ flash('Yes!'); r++; setTimeout(round, 1300); }
        else pip(placed);
        return true;
      }
      card.dataset.missed = '1'; shake(target); react('.dprompt .critter','oops');
      return false;
    };
    stage.querySelectorAll('.dcard').forEach(c => draggable(c, onDrop));
    stage.querySelectorAll('.dtarget').forEach(t => dropTarget(t, onDrop));
  }
  round();
}

/* ======================= MECHANIC 4: FIND THE PAIRS ======================= */
function playPairs(id, kind, n, done){
  const items = kind === 'g' ? greenItems(n) : redSet(n);
  const cards = shuffle(items.flatMap((it,k) => [
    {k, face: kind === 'g' ? `<span class="pw g">${soundButtons(it.sounds)}</span>` : `<span class="pw r">${esc(it.w)}</span>`, label: it.w},
    {k, face: kind === 'g' ? `<span class="pp">${it.pic}</span>` : `<span class="pw r">${esc(it.w)}</span>`, label: kind === 'g' ? 'picture: ' + it.w : it.w}
  ]));
  stage.innerHTML = `<div class="pairs" style="--cols:${n === 3 ? 3 : 4}">${cards.map(c =>
    `<button class="pcard" data-k="${c.k}" aria-label="hidden card" data-label="${esc(c.label)}"><span class="pin"><span class="pback">?</span><span class="pfront">${c.face}</span></span></button>`).join('')}</div>`;
  let open = [], found = 0, tries = 0, lock = false;
  pip(0);
  stage.querySelectorAll('.pcard').forEach(b => b.onclick = () => {
    if(!live(id) || lock || b.classList.contains('open') || b.classList.contains('matched')) return;
    b.classList.add('open'); b.setAttribute('aria-label', b.dataset.label);
    open.push(b);
    if(open.length < 2) return;
    tries++; lock = true;
    const [a, c] = open;
    if(a.dataset.k === c.dataset.k){
      setTimeout(() => {
        if(!live(id)) return;
        a.classList.add('matched'); c.classList.add('matched');
        earn(1, c); pip(found, 'done'); found++;
        open = []; lock = false;
        if(found === n){
          run.good = n;
          run.stars = tries <= n + 1 ? 3 : tries <= n + 4 ? 2 : 1;
          flash('All found!');
          setTimeout(done, 1000);
        } else pip(found);
      }, 380);
    } else {
      setTimeout(() => {
        a.classList.remove('open'); c.classList.remove('open');
        a.setAttribute('aria-label','hidden card'); c.setAttribute('aria-label','hidden card');
        open = []; lock = false;
      }, 1050);
    }
  });
}

/* ======================= TIME'S UP ======================= */
function showTimesUp(){
  save();
  setupScreen(`
    <div class="duo">${goCritter().replace('critter go','critter go sleepy')}${stopCritter().replace('critter stop','critter stop sleepy')}</div>
    <h1>Time's up!</h1>
    <div class="namebox"><span class="big" aria-hidden="true">${player ? player.avatar : '🌙'}</span>
      <p style="margin:0;font-size:1.2rem;font-weight:500">Great reading today${player ? ', ' + esc(player.name) : ''}! The critters are having a rest. Come back tomorrow.</p></div>
    <div class="setup-actions">
      <button class="btn alt" id="tuPlayers">Change player</button>
      <button class="btn" id="tuGrown">${'Grown-ups'}</button>
    </div>`);
  $('#tuPlayers').onclick = showPlayers;
  $('#tuGrown').onclick = () => parentGate(() => showSettings(showMap), showTimesUp);
}

/* ======================= GROWN-UP GATE + SETTINGS ======================= */
function parentGate(onPass, onCancel){
  const a = 4 + Math.floor(Math.random()*6), b = 5 + Math.floor(Math.random()*5);
  setupScreen(`
    <h1>Grown-ups only</h1>
    <form class="namebox" id="gateForm">
      <label for="gateAns">To open settings, answer this sum.</label>
      <span class="gatesum">${a} + ${b} = ?</span>
      <input id="gateAns" inputmode="numeric" pattern="[0-9]*" maxlength="3" autocomplete="off" aria-label="answer">
      <button class="btn" type="submit">Open settings</button>
    </form>
    <button class="linkback" id="setupBack">← Back</button>`);
  $('#setupBack').onclick = onCancel;
  $('#gateForm').onsubmit = e => {
    e.preventDefault();
    if(+$('#gateAns').value === a + b) onPass();
    else { shake($('#gateForm')); $('#gateAns').value = ''; $('#gateAns').focus(); }
  };
  $('#gateAns').focus();
}
function showSettings(back){
  shell('Grown-up settings', 'board', 0, back);
  const fmt = sec => { const m = Math.floor(sec/60); return m < 1 ? 'less than 1 min' : m + ' min'; };
  const limits = [0, 10, 15, 20, 30, 45, 60];
  const timers = [['normal','Normal'],['relaxed','Relaxed (twice as long)'],['off','Off']];
  stage.innerHTML = `
    <div class="setcard">
      <h3>Daily play time</h3>
      <p class="hint">How long each child can play each day. Time counts on the map and in games, and starts again every morning. When time runs out, they finish the level they are on first.</p>
      <div class="chips" role="group" aria-label="Daily play time">${limits.map(m =>
        `<button class="chip" data-limit="${m}" aria-pressed="${settings.limit === m}">${m ? m + ' min' : 'No limit'}</button>`).join('')}</div>
    </div>
    <div class="setcard">
      <h3>Speedy Tap countdown</h3>
      <p class="hint">The bar that runs down while a child chooses an answer.</p>
      <div class="chips" role="group" aria-label="Speedy Tap countdown">${timers.map(([k,n]) =>
        `<button class="chip" data-timer="${k}" aria-pressed="${settings.timer === k}">${n}</button>`).join('')}</div>
    </div>
    <div class="setcard">
      <h3>Players</h3>
      <p class="hint">Time played today${settings.limit ? `, out of ${settings.limit} min` : ''}.</p>
      <div id="plist">${players.length ? players.map(p => {
        const t = timeRec(p), lim = settings.limit ? settings.limit + t.extra : 0;
        return `<div class="prow" data-id="${esc(p.id)}">
          <span class="bava" aria-hidden="true">${p.avatar}</span>
          <span class="pinfo">${esc(p.name)}<small>${fmt(t.used)} today${t.extra ? ` · +${t.extra} min extra` : ''}${lim && t.used >= lim*60 ? ' · time is up' : ''}</small></span>
          ${settings.limit ? '<button class="mini" data-act="extra">+10 min today</button>' : ''}
          <button class="mini danger" data-act="remove">Remove</button>
        </div>`;
      }).join('') : '<p class="hint">No players yet.</p>'}</div>
    </div>`;
  save();
  stage.querySelectorAll('[data-limit]').forEach(b => b.onclick = () => { settings.limit = +b.dataset.limit; saveSettings(); showSettings(back); });
  stage.querySelectorAll('[data-timer]').forEach(b => b.onclick = () => { settings.timer = b.dataset.timer; saveSettings(); showSettings(back); });
  stage.querySelectorAll('.prow').forEach(row => {
    const p = players.find(x => x.id === row.dataset.id);
    const extra = row.querySelector('[data-act="extra"]');
    if(extra) extra.onclick = () => { timeRec(p).extra += 10; save(); showSettings(back); };
    row.querySelector('[data-act="remove"]').onclick = e => {
      const cell = e.currentTarget;
      cell.outerHTML = `<span class="pinfo" style="flex:0 1 auto;min-width:0">Remove ${esc(p.name)} and their coins?</span><button class="mini yes" data-act="yes">Yes, remove</button><button class="mini" data-act="no">Keep</button>`;
      row.querySelector('[data-act="no"]').onclick = () => showSettings(back);
      row.querySelector('[data-act="yes"]').onclick = () => {
        players = players.filter(x => x.id !== p.id);
        if(player && player.id === p.id){ player = null; year = term = null; back = showPlayers; }
        save(); showSettings(back);
      };
    };
  });
  // leaving settings: go somewhere that still makes sense
  backTo = () => { if(!player) return showPlayers(); if(back === showTimesUp || back === showMap) return showMap(); back(); };
}

/* ======================= LEADERBOARD ======================= */
function showBoard(back){
  shell('Leaderboard', 'board', 0, back);
  const list = players.slice().sort((a,b) => b.coins - a.coins || starTotal(b) - starTotal(a));
  stage.innerHTML = `
    <p class="boardnote">Everyone who plays on this device.</p>
    <div class="board">${list.length ? list.map((p,k) => `
      <div class="brow${player && p.id === player.id ? ' mine' : ''}">
        <span class="rank${k < 3 ? ' r' + (k+1) : ''}">${k+1}</span>
        <span class="bava" aria-hidden="true">${p.avatar}</span>
        <span class="bname">${esc(p.name)}</span>
        <span class="bstat bst"><span class="st">★</span>${starTotal(p)}</span>
        <span class="bstat"><span class="coin"></span>${p.coins}</span>
      </div>`).join('') : '<p class="boardnote">No players yet.</p>'}</div>`;
}

/* ======================= SOUNDS & RED WORDS ======================= */
function showSounds(back, tab){
  shell('Sounds & Red Words', 'sounds', 0, back);
  const nowSet = player && year && term ? STAGES[stageKey()].set : 0;
  tab = tab || (nowSet || 1);
  const tabs = [1,2,3].map(s => `<button class="tab" role="tab" aria-selected="${tab === s}" data-tab="${s}">Set ${s}${s === nowSet ? '<span class="nowtag">Now</span>' : ''}</button>`).join('')
    + `<button class="tab" role="tab" aria-selected="${tab === 'red'}" data-tab="red">Red words</button>`;
  let body;
  if(tab === 'red'){
    const groups = [['reception','Reception'],['year1','Year 1']].flatMap(([y,yn]) => TERMS.map(t => [y,t,yn]));
    body = `<p class="setnote">Red words can't be sounded out. Learn to spot them straight away.</p>` + groups.map(([y,t,yn]) => {
      const isNow = player && y === year && t === term;
      return `<div class="redgroup"><h3>${yn} · ${t[0].toUpperCase()+t.slice(1)}${isNow ? '<span class="nowtag">Now</span>' : ''}</h3>
        <div class="redwrap">${RED_NEW[`${y}-${t}`].map(w => `<span class="redchip">${esc(w)}</span>`).join('')}</div></div>`;
    }).join('');
  } else {
    const S = SOUND_SETS[tab];
    body = `<p class="setnote">${S.note}</p>` + S.groups.map(([gname, list]) =>
      `${S.groups.length > 1 ? `<div class="subhead">${gname}</div>` : ''}<div class="soundgrid">${list.map(([snd, ex]) =>
        `<div class="stile"><span class="gr">${soundButtons(snd)}</span><span class="ex">${soundButtons(ex)}</span></div>`).join('')}</div>`).join('');
  }
  stage.innerHTML = `
    <div class="soundsintro">
      <span class="key">${soundButtons('s')} one sound</span>
      <span class="key">${soundButtons('sh')} special friends</span>
      <span class="key">${soundButtons('a-e k')} split sound</span>
    </div>
    <div class="tabs" role="tablist">${tabs}</div>
    ${body}`;
  stage.querySelectorAll('.tab').forEach(b => b.onclick = () => {
    const t = b.dataset.tab === 'red' ? 'red' : +b.dataset.tab;
    showSounds(back, t);
  });
}
